Name: "Pilates by Edita - fokus på mageøvelser"
Duration: 60
Description: |
  Pust:
  I Pilates puster vi inn gjennom nesen og ut gjennom munnen (tynt blad mellom leppene). Pusten kobler kropp og sinn og hjelper deg å aktivere kjernen.  ribbena åpner seg ut og bak på innpust. Dette gir plass til kjernen samtidig som kroppen får oksygen og ro. 

Poses:

  - Name: Landing
    Duration: 3
    Description: |
      Landing 
      Legg dere på ryggen og lukk øynene, så puster du normalt. 
      Kjenn at du lander på matta di..
      Så puster du inn gjennom nesa..og ut gjennom munnen..

      Utførelse: 
      Legg henden på ribbeina slik at fingertuppene møtes. Pust inn og kjenn utvidelsen av ribbeina og at fingertuppene glir fra hverandre.
      Pust ut og kjenn at fingertuppene møtes..

      Cue: “fyll ribbena som et trekkspill” “Utpusten lukker ribbeina som et trekkespill”

  - Name: Pelvic tilt eller inprint
    Duration: 2
    Description: |
      Startposisjon: Ligg på ryggen med bøyde knær, føttene i hoftebreddenes avstand, og en fot lengde mellom foten og bekken. 

      Utførelse: På utpust vipp bekkenet bakover slik at korsryggen smelter mot matten. På innpust, gå tilbake til nøytral. Repeter et par ganger. 

  - Name: Toe Taps
    Duration: 3
    Description: |
      Toe Taps: 6 pust på hver side
      Startposisjon: Ligg på ryggen, ben i tabletop (90 grader hofte og kne). Armene skal peke oppover. 
      Utførelse: Pust inn. På utpust senker du en tå til gulvet om gangen Pust inn før tilbake. Bytt side. Pust ut når du senker tå til gulvet og pust inn tilbake. 
      Lærercues: Imprint anbefales. Bruk magen og pusten til å føre foten ned. Prøv å være bevisst på at hoftenøyer ikke jobber, men magen.

      Overgang: 

  - Name: Dead bug - en side om gangen
    Duration: 3
    Description: |
      Dead bug: 6 pust på hver side
      Startposisjon: Ligg på ryggen, armer opp mot taket, ben i tabletop. 
      Utførelse: Pust inn. På utpust senker du en arm bakover og motsatt ben ned. Pust inn før tilbake. Bytt side. Pust ut når du strekker, inn tilbake. 
      Lærercues: “Som et korsett rundt midjen” “Bevær trykket i korsryggen". Pass på så ikke korsryggen svaier - “Stopp før du mister kontakten”. 

      Overgang: vi holder dead bug pose. 

  - Name: Dead bug - begge sider
    Duration: 3
    Description: |
      Dead bug: 6 pust.
      Startposisjon: Ligg på ryggen, armer opp mot taket, ben i tabletop. 
      Utførelse: Pust inn. På utpust senker du begge armene bakover og begge beina ned skrått. Pust inn før tilbake. Pust ut når du strekker, inn tilbake. 
      Lærercues: “Som et korsett rundt midjen” “Bevær trykket i korsryggen". Pass på så ikke korsryggen svaier - “Stopp før du mister kontakten”. 

      Overgang: strekk ut beina. og legg deg på siden. Ta et par pust her før du står på alle fire.

  - Name: Roll like a ball
    Duration: 3
    Description: |
      Roll like a ball: 
      Startposisjon:
      Sitt på sitteknutene, hold knærne tett, rund rygg, blikket mot navlen. 
      Utførelse: 
      Pust inn og på utpust, rull bak til skuldrene og opp igjen, hold balanse og bruk magen. Beina skal ikke bevege seg. 
      Modifikasjoner: Hold bak lårene. 
      Instruktørtips: “Hold en liten ballform - ikke la den sprekke”.

  - Name: Cat and cow
    Duration: 3
    Description: |
      Cat and cow: 6 pust
      Startposisjon: hender og knær på matte, nøytral rygg. 
      Utførelse: Pust inn. På utpust rund rygg virvel for virvel. Vi starter bevegelsen fra bekken og ruller virvel for virvel.
      Pust inn. På utpust svai ryggen virvel for virvel og vi starter fra bekken igjen. Nakken og hodet plasseres sist. 

      Overgang: Fra cat and cow går vi over til stående svømmer. 

  - Name: Flying dog/ Stående svømmer
    Duration: 4
    Description: |
      Flying dog/ Stående svømmer: 5 på hver side= 10 pust/øvelser. En side om gangen. 
      Startposisjon: Stå på alle 4
      Utførelse: Pust inn. På utpust strekk ut høyre bein og venstre arm og pust inn på vei tilbake til utgangsposisjonen. Bekken og ryggsøyle i nøytral posisjon.

      Overgang: fra svømmeren/ flying dog,  går vi på alle 4 og over i hunden som ser ned.

  - Name: Planke og hunden som ser ned
    Duration: 3
    Description: |
      Planke og hunden som ser ned:  5 repetisjoner
      Startposisjon: Hunden som ser ned.
      Utførelse: Pust inn og på utpust går vi over i planke. Pust inn og på utpust over i hunden som ser ned.

  - Name: Hunden som ser ned og et bein opp mot motsatt albu
    Duration: 3
    Description: |
      Hunden som ser ned og et bein opp mot motsatt albu: 3 pust på hver side.

      Startposisjon: Hunden som ser ned.
      Utførelse: Pust inn. På utpust strekk opp høyre bein, bøy i kne og før kne mot motsatt venstre albue- Pust inn og pust ut, strekk ut foten. Pust inn, bøy kne og på utpust før høyre kne mot venstre albue. Ta tre repetisjoner (tre pust). Og bytt side. 

      Overgang: Hunden som ser ned  og rull opp virvel for virvel, med skuldrene og nakken plassert sist. 

  - Name: Stående balanseøvelse
    Duration: 4
    Description: |
      Start posisjon: stå rett med begge føttene i bakken. Balanse øvelse. 6 repetisjoner på hver side. 
      Utførelse: Pust inn og løft høyre fot (90 graders vinkel, mellom hofte og lår). Pust ut og før foten bak, og kroppen frem (armene i prayer) eller armene rett opp og hold skuldrene nede. Pust inn, send foten frem stående på en fot. Pust inn stående på en fot og pust ut, send utilbake. 6 repetisjoner. På siste holde i 6 sekunder og rolig sende foten frem, og senke foten. 
      Bytt side. 

      Overgang: Stående rulle nedover virvel for virvel. Gå armene opp til toppen av matta til hunden som ser ned. 

  - Name: Rett planke
    Duration: 3
    Description: |
      Start posisjon: Hunden som ser ned
      Utførelse: Fra hunden som ser ned går du over i planke med å føre kroppen frem og beina litt lenger bak. Stå fem pust i rett planke. 

  - Name: Side planke
    Duration: 3
    Description: |
      Side planke: Fra rett planke, gå over til høyre sideplanke. (5 pust) og deretter over til rett planke (1 pust) og derifra til venstre sideplanke (5 pust).

      Overgang: Childe pose 5 pust. 

  - Name: C kurve
    Duration: 4
    Description: |
      C kurve
      Start posisjon: sitte med rett rygg
      Utførelse: Bøy knær i startposisjon og send overkroppen bakover med en C kurve i ryggen. Rett armene, ha rette skuldre. Hvis du vil ha større utfordring kan du ha rette bein i 60 graders vinkel. Send kroppen frem på innpust og tilbake til startposisjon på utpust. 5 repetisjoner.

      Utvidelse: På utpust. Før høyre arm bak og bøy i albuen, se over mot høyre hånd. Send armen tilbake til å peke rett frem på innpust. 
      På utpust send venstre arm bakover og bøy i albuen, seo ver mot venstre hånd. På innspust send armen rett frem. 
      6 repetisjoner (pust) på hver side.
      Hvis en ønsker enda en utvidelse så kan en strekke begge beina frem (60 graders vinkel) og begge armene bak og opp så tilbake til ugangs posisjon og repetere 5 ganger.
      Overgang: legg den ned på ryggen.

  - Name: Criss-Cross
    Duration: 4
    Description: |
      Criss-Cross
      Start posisjon: Ryggliggende, hender bak hodet, beina i tabletop.
      Utførelse: Ha hendene bak nakken. Pust inn og på utpust løft hodet/skuldre.  Pust inn og på utpust roter høyre albue mot motsatt venstre kne, mens du strekker høyre fot. På innpust trekk tilbake til midten. Pust inn og på utpust, send venstre albue mot høyre kne, mens du strekker venstre fot. Pust inn tilbake til midten. 6 pust på hver side. 
      Bekkenplassering: Imprint

      Cue: Tenk skulder mot kne, ikke albue. Kjenn når du roterer at du bruker mage skrå. 

  - Name: Roll upp
    Duration: 4
    Description: |
      Roll upp:
      Start posisjon: Ryggliggende, beina peker rett frem og føttene lett pointet, armer bakover.
      Utførelse: På innpust send armene til tynningen og  rull opp med armene peke rett mot taket mens skuldrene og hodet er lett løftet (husk at nakken skal ikke løfte her), bruke magen på innpust. 
      På utpust fortsett å rulle oppover, virvel for virvel med magen, fremover med fingrene peke mot tærne. 
      På innpust begynner du å rulle bakover, frem til bakken er helt i kontakt med matten og skuldrene og armene peker rett frem (parallelle med beina). 
      På utpust fortsett å rulle bakover, virvel for virvel, frem til armene er med tynningen. 
      På innpust fortsett oppover til armene peker rett opp og skuldrene og hode løftet. 
      10 repetisjoner. 

  - Name: Roll like a ball
    Duration: 2
    Description: |
      Roll like a ball: 
      Startposisjon: Sitt på sitteknutene, hold knærne tett, rund rygg, blikket mot navlen. 
      Utførelse: Pust inn og på utpust, rull bak til skuldrene og opp igjen, hold balanse og bruk magen. Beina skal ikke bevege seg. 
      Modifikasjoner: Hold bak lårene. 
      Instruktørtips: “Hold en liten ballform - ikke la den sprekke”.

  - Name: Pil
    Duration: 4
    Description: |
      Pil:
      Start posisjon: Ligg på magen, armene bak kroppen, pannen i matten. 
      Utførelse: Pust inn og på utpust hold i bekkene mens du løfter hodet, bryst og armer og bein, klem skulderbladene sammen. Pust inn tilbake. Og repeter 6 ganger, mens du holder den siste i 5 pust. 
      Instruktørens tips: Tenk lang nakke, se mot matten. 

  - Name: Meditasjon på slutten
    Duration: 2
    Description: |
      Meditasjon på slutten 2-3 minutter
