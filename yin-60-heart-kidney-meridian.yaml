Name: "Yin Yoga – Heart & Kidney Meridian"
Duration: 60
Description: |
  **Theme:** Grounding the Heart · Opening Breath · Emotional Balance
  **Primary Meridians:** Heart, Lung
  **Secondary Support:** Kidney, Urinary Bladder

Poses:



  - Name: Opening Meditation
    Duration: 3
    Description: |
      Arrive in stillness. Feel the weight of the body supported by the ground.
      Invite awareness to the natural rhythm of the breath — without changing it.
      Set an intention connected to the heart: openness, compassion, or presence.
    Sensation:
      - Groundedness
      - Heart awareness
      - Breath softening



  - Name: Dangling
    Duration: 3
    Description: |
      Standing Forward Fold – Yin version. Ground the nervous system before opening the chest and breath.

      **Rebound:** Constructive rest or standing pause – 1–2 minutes.
    Meridians:
      - Urinary Bladder
      - Kidney
    Sensation:
      - Spinal release
      - Nervous system grounding
      - Posterior chain opening



  - Name: Supported Squat (Malasana)
    Duration: 3
    Description: |
      Creates stability and rooting — preparing for heart opening later.

      **Rebound:** Seated stillness – 1 minute.
    Meridians:
      - Kidney
      - Liver
      - Spleen
    Sensation:
      - Grounding
      - Pelvic stability
      - Inner leg release



  - Name: "Dragonfly – Right Side"
    Duration: 3
    Description: |
      From a wide seated straddle, fold over the right leg. Keep the spine relaxed — no pulling.
      Allow breath to widen the back ribs.

      **Counterpose:** Windshield wipers – 1 minute.
    Meridians:
      - Liver
      - Kidney
      - Urinary Bladder
    Sensation:
      - Inner legs, hamstrings
      - Breath expanding back ribs



  - Name: "Dragonfly – Left Side"
    Duration: 3
    Description: |
      Fold over the left leg. Keep the spine relaxed — no pulling.
      Allow breath to widen the back ribs.

      **Counterpose:** Windshield wipers – 1 minute.
    Meridians:
      - Liver
      - Kidney
      - Urinary Bladder
    Sensation:
      - Inner legs, hamstrings
      - Breath expanding back ribs



  - Name: "Dragonfly – Centre"
    Duration: 3
    Description: |
      Fold forward down the middle. Keep the spine relaxed — no pulling.
      Allow breath to widen the back ribs.

      **Counterpose:** Windshield wipers – 1 minute.
    Meridians:
      - Liver
      - Kidney
      - Urinary Bladder
    Sensation:
      - Inner legs, hamstrings
      - Breath expanding back ribs



  - Name: Sphinx
    Duration: 3
    Description: |
      Lie on the belly. Place elbows slightly forward of shoulders and rest onto forearms. Allow the
      belly to soften toward the floor.

      Notice the breath moving into the upper ribs and heart space.

      **Counterpose:** Rest on belly, head turned right, right knee drawn up – 1 minute.
    Meridians:
      - Urinary Bladder
      - Kidney
      - Lung
      - Heart
    Sensation:
      - Lower back compression
      - Heart space opening
      - Breath deepening into upper ribs



  - Name: Supported Fish
    Duration: 4
    Description: |
      Lie back over a bolster placed horizontally under the upper back and heart.
      Head and neck supported. Legs extended or bent, arms opening wide with palms up.

      **Yin Reminder:** Support is essential — this pose should feel *held*, not strained.

      **Rebound:** Shavasana or constructive rest – 1 minute.
    Meridians:
      - Heart
      - Lung
    Sensation:
      - Expansion across chest, collarbones, shoulders
      - Breath naturally deepening
      - Emotional openness or vulnerability may arise




  - Name: "Swan – Right Side"
    Duration: 4
    Description: |
      Bring the right knee forward and out to the side, left leg extends behind.

      **Full Swan:** 1 minute. Stay lifted on hands, compression in right hip.

      **Sleeping Swan:** 3 minutes. Fold the torso forward over the front leg.

      **Counterpose:** Child's Pose – 1 minute.
    Meridians:
      - Liver
      - Gallbladder
    Sensation:
      - Deep hip opening
      - Emotional release before heart work



  - Name: "Swan – Left Side"
    Duration: 4
    Description: |
      Repeat on the left side.

      **Full Swan:** 1 minute.

      **Sleeping Swan:** 3 minutes.

      **Rebound:** Shavasana – 1 minute.
    Meridians:
      - Liver
      - Gallbladder
    Sensation:
      - Deep hip opening
      - Emotional release before heart work



  - Name: Melting Heart (Anahatasana)
    Duration: 4
    Description: |
      From tabletop, keep hips over knees and slowly melt the chest toward the floor.
      Forehead or chin rests on support. Arms extended or bent.

      **Rebound:** Child's Pose – 1 minute.
    Meridians:
      - Lung
      - Heart
    Sensation:
      - Chest, shoulders, armpits
      - Breath awareness — especially inhalation



  - Name: Reclined Butterfly (Supta Baddha Konasana)
    Duration: 5
    Description: |
      Lie back over a bolster lengthwise. Soles of feet together, knees supported.
      Arms may open wide or rest on the belly and heart.

      Feel the breath gently lifting the heart.

      **Rebound:** Shavasana – 1 minute.
    Meridians:
      - Heart
      - Lung
    Sensation:
      - Deep chest and heart opening
      - Breath lifting the heart
      - Full surrender



  - Name: "Reclined Twist – Right Side"
    Duration: 3
    Description: |
      Draw knees in, send right knee to the left, supported by bolster.
      Left leg relaxed long. Shoulders heavy.

      **Rebound:** Shavasana – 1 minute.
    Meridians:
      - Gallbladder
      - Urinary Bladder
      - Heart
    Sensation:
      - Detoxification
      - Emotional unwinding via gentle spinal rotation



  - Name: "Reclined Twist – Left Side"
    Duration: 3
    Description: |
      Repeat on opposite side.

      **Rebound:** Shavasana – 1 minute.
    Meridians:
      - Gallbladder
      - Urinary Bladder
      - Heart
    Sensation:
      - Detoxification
      - Emotional unwinding via gentle spinal rotation



  - Name: Final Shavasana
    Duration: 9
    Description: |
      Total rest. Invite softness behind the heart and an easy, effortless breath.
      Allow the effects of the practice to integrate fully.
    Sensation:
      - Softness behind the heart
      - Effortless breath
      - Full integration