Name: "Yin Yoga – 60 Minutes"
Duration: 60
Description: |
  **Theme:** Heart · Lung · Kidney · Urinary Bladder · Gallbladder

  **Primary Meridians:** Heart, Lung

  **Support:** Kidney, Urinary Bladder, Gallbladder, Liver

Poses:



  - Name: Landing
    Duration: 5
    Description: |
      Arrive in stillness in a comfortable seat or constructive rest.
      Set an intention for the session and become aware of the breath.
      Let body and mind tune in — without changing anything.
    Sensation:
      - Rest and presence
      - Breath awareness
      - Intention setting



  - Name: Dangling (Standing Forward Fold)
    Duration: 4
    Description: |
      Standing forward fold — Yin version. Grounds the nervous system
      before chest and breath open. Let arms and head hang heavy.

      **Rebound:** Stand upright in stillness for 0.5 min.
    Meridians:
      - Urinary Bladder
      - Kidney
    Sensation:
      - Spinal release
      - Nervous system grounding
      - Opening of the back body



  - Name: Supported Squat (Malasana)
    Duration: 3
    Description: |
      Creates stability and grounding — preparation for heart opening.

      **Rebound:** Stand upright for 0.5 min.
    Meridians:
      - Liver
      - Kidney
    Sensation:
      - Grounding
      - Pelvic stability
      - Inner thigh opening



  - Name: Caterpillar
    Duration: 4
    Rebound:
      Description: Lie on the back (shavasana)
      Duration: 1
    Description: |
      Legs extended forward, letting the upper body rest relaxed forward, optionally on a bolster.
      Release tension in the back and hips. No active pulling — let gravity do the work.
    Meridians:
      - Kidney
      - Urinary Bladder
    Sensation:
      - Back and hip opening
      - Release of the posterior chain
      - Grounding



  - Name: Reclined Butterfly (Supta Baddha Konasana)
    Duration: 4
    Description: |
      Lie on the back with a bolster lengthwise under the spine, knees out to the sides
      with soles of the feet together. Let the chest open.

      **Rebound:** Lie on the side for 0.5 min.
    Meridians:
      - Heart
      - Lung
    Sensation:
      - Chest and heart opening
      - Breath lifting the heart
      - Release in the groin



  - Name: Fish
    Duration: 4
    Description: |
      Opens the chest and throat. Support with a bolster under the upper back for a gentle Yin version.
      Palms face up, arms open wide.

      **Rebound:** Lie flat on the back for 0.5 min.
    Meridians:
      - Heart
      - Lung
    Sensation:
      - Expansion across the chest
      - Opening of the throat
      - Breath naturally deepening



  - Name: Sphinx
    Duration: 4
    Rebound:
      Description: Lie flat on the belly, turn head to the right and draw the right knee up along the floor
      Duration: 1
    Description: |
      Lie on the belly. Place elbows slightly forward of the shoulders and rest on the forearms.
      Let the belly soften toward the floor.

      Notice the breath moving into the upper ribs and heart space.
    Meridians:
      - Urinary Bladder
      - Kidney
      - Stomach
      - Spleen
    Sensation:
      - Lower back compression
      - Heart space opening
      - Breath awareness in the upper ribs



  - Name: Sphinx – Seal Variation
    Duration: 4
    Rebound:
      Description: Lie flat on the belly, turn head to the left and draw the left knee up along the floor
      Duration: 1
    Description: |
      Straighten the arms further for a deeper backbend and compression.
      Keep shoulders relaxed away from the ears.
    Meridians:
      - Urinary Bladder
      - Kidney
      - Stomach
      - Spleen
    Sensation:
      - Deeper lower back compression
      - Opening of the abdominal region
      - Warmth in the core



  - Name: Supported Bridge
    Duration: 4
    Description: |
      Place a block under the sacrum for supported bridge.
      Let the body sink into the block and breathe along the spine.

      **Rebound:** Remove the block and draw knees in toward each other for 0.5 min.
    Meridians:
      - Kidney
      - Urinary Bladder
    Sensation:
      - Hip flexor opening
      - Support in the sacral region
      - Ease in the lower back



  - Name: "Swan – Right Side"
    Duration: 5
    Rebound:
      Description: Child's Pose
      Duration: 1
    Description: |
      Bring the right knee forward and out to the side, left leg extends behind.

      **Full Swan:** 3 minutes. Stay lifted on hands, compression in the right hip.

      **Sleeping Swan:** 1 minute. Fold the torso forward over the front leg.
    Meridians:
      - Gallbladder
      - Liver
    Sensation:
      - Deep hip opening
      - Emotional release
      - Hip joint rotation



  - Name: "Swan – Left Side"
    Duration: 5
    Rebound:
      Description: Child's Pose
      Duration: 1
    Description: |
      Repeat on the left side.

      **Full Swan:** 3 minutes.

      **Sleeping Swan:** 1 minute.
    Meridians:
      - Gallbladder
      - Liver
    Sensation:
      - Deep hip opening
      - Emotional release
      - Hip joint rotation



  - Name: "Reclined Twist – Right Side"
    Duration: 3
    Description: |
      Draw knees in and send the right knee to the left, supported by a bolster if available.
      Shoulders heavy toward the floor.

      **Rebound:** Shavasana 0.5 min.
    Meridians:
      - Gallbladder
      - Urinary Bladder
      - Heart
      - Lung
    Sensation:
      - Detoxification
      - Emotional unwinding through spinal rotation
      - Lightness in the chest



  - Name: "Reclined Twist – Left Side"
    Duration: 3
    Description: |
      Repeat on the opposite side.

      **Rebound:** Shavasana 0.5 min.
    Meridians:
      - Gallbladder
      - Urinary Bladder
      - Heart
      - Lung
    Sensation:
      - Detoxification
      - Emotional unwinding through spinal rotation
      - Lightness in the chest



  - Name: Shavasana
    Duration: 8
    Description: |
      Total rest. Invite softness behind the heart and an easy, effortless breath.
      Allow the effects of the practice to integrate fully.
    Sensation:
      - Full rest and integration
      - Effortless breath
      - Softness in the heart space
