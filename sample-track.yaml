Name: "Yoga for Hip Opening"
Description:
  This track is designed to open the hips and stretch the inner thighs, 
 hamstrings, and lower back. It includes a combination of static holds and dynamic movements to target the hip flex
Duration: 60 minutes

Poses:
  - Name: Meditation
    Duration: 3
    Description: Set the intention for the session.

  - Name: Dangling
    Duration: 2–3 minutes
    Description: Stand with your feet hip-width apart, hinge at the hips, and let your upper body hang down towards the floor. Allow your head to relax and your arms to dangle freely. You can gently sway side to side or forward and backward to release tension in the hips and lower back.
    Meridians:
      - Kidney
      - Bladder
      - Liver
