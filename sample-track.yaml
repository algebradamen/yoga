Poses:
  - Name: Meditation
    Duration: 3
    Sensation: Calm, centred presence
    Description: |
      Sit comfortably in a cross-legged position or on a chair with your feet flat on the floor. 
      Close your eyes, soften your jaw, and set a personal intention for your practice. 
      Breathe naturally, allowing the breath to become slow and deep. Let thoughts pass without attachment.
    Alternatives:
      Name: Seated Meditation
      Description: |
        Sit comfortably in a cross-legged position or on a chair with your feet flat on the floor. 
        Close your eyes, soften your jaw, and set a personal intention for your practice. 
        Breathe naturally, allowing the breath to become slow and deep. 
        Let thoughts pass without attachment.

  - Name: Dangling
    Duration: 3
    Description: |
      Stand with feet hip-width apart. Bend your knees slightly and fold forward from the hips, letting your torso hang heavy toward the floor. Clasp opposite elbows and let the weight of your arms and head create a gentle traction along the spine. Surrender all effort — let gravity do the work.
      
      This pose decompresses the lumbar spine, stretches the hamstrings and calves, and stimulates the Urinary Bladder and Kidney meridians that run along the posterior chain.
    Meridians:
      - Kidney
      - Bladder
      - Liver


  - Name: Supported Squat (Malasana)
    Meridians:
      - Kidney

