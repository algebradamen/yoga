Name: "Yin Yoga – 60-Minute Track"
Duration: 60
Description: |
  **Theme:** Grounding · Spinal Hydration · Lower‑Body Release
  
  **Style:** Classical Yin (passive, supported, still)

  This is a Kidney, Urinary Bladder, Liver and Heart dominant practice, with a strong emphasis on grounding, spinal hydration, nervous system calming, and emotional release.

  **Meridians:** This is a Kidney, Urinary Bladder, Liver and Heart dominant practice, with a strong emphasis on grounding, spinal hydration, nervous system calming, and emotional release.

Poses:
  - Name: Opening Meditation
    Duration: 3
    Sensation:
      - Breath awareness
      - Grounding
      - Transition from doing to being
    Description: |
      Arrive in stillness. Allow the body to settle and the breath to soften.
      Invite participants to set an intention for the practice — a word, quality, or simple presence.
      
      **Focus:**  
      • Breath awareness
      • Grounding
      • Transition from doing to being

  - Name: Dangling
    Duration: 3
    Meridians:
      - Urinary Bladder
      - Kidney
    Sensation:
      - Hamstrings, calves, spine, lower back
      - Gentle spinal decompression
      - Quieting of the mind
    Description: |
      From standing, place feet hip‑width apart. Slowly hinge forward from the hips and allow the upper
      body to fully release. Let the head and neck hang heavy. Knees may be deeply bent. Hands can rest
      on blocks, a bolster, or hang freely.

      This is a passive shape — allow gravity to create gentle traction through the spine.
      
      **Meridians & Energetic Focus:**  
        • Primary: Urinary Bladder, Kidney
        • Secondary: Nervous system (parasympathetic)
          
      **Sensation & Awareness:**
          • Hamstrings, calves, spine, lower back
          • Gentle spinal decompression
          • Quieting of the mind

      **Yin Reminder:** Discomfort is okay. Pain is a signal to adjust or come out.
      
      ### Rebound – 1–2 minutes  
        Stand slowly, stacking the spine, or rest in constructive rest.
        Notice warmth, pulsation, or subtle movement along the spine and legs.


  - Name: Supported Squat (Malasana)
    Duration: 3
    Description: |
      Feet wider than hips, toes turning slightly out. Bend knees and lower hips toward the floor.
      Heels may be supported. Sit on a block or bolster if needed. Elbows may rest inside knees.

      Allow the pelvis to sink heavily. No effort to hold posture.

      **Yin Reminder:** We soften into sensation — we do not force depth.
    Meridians:
      - Kidney
      - Liver
      - Spleen
      - Gallbladder
    Sensation:
      - Ankles, knees, hips, groins
      - Compression through pelvis
      - Grounding and stability
  - Name: "Dragonfly – Right Side"
    Duration: 3
    Description: |
      From a wide seated straddle, fold over the right leg. Allow the torso to release passively
      toward the right leg without pulling.

      **Counterpose:** Windshield wipers – 1 minute.
    Meridians:
      - Liver
      - Kidney
      - Urinary Bladder
    Sensation:
      - Inner legs, hamstrings, spine
      - Broad opening and release through hips
  - Name: "Dragonfly – Left Side"
    Duration: 3
    Description: |
      Fold over the left leg. Allow the torso to release passively toward the left leg without pulling.

      **Counterpose:** Windshield wipers – 1 minute.
    Meridians:
      - Liver
      - Kidney
      - Urinary Bladder
    Sensation:
      - Inner legs, hamstrings, spine
      - Broad opening and release through hips
  - Name: "Dragonfly – Centre"
    Duration: 3
    Description: |
      Fold forward down the middle of the straddle. Allow the spine to round and the torso to melt
      toward the floor.

      **Counterpose:** Windshield wipers – 1 minute.
    Meridians:
      - Liver
      - Kidney
      - Urinary Bladder
    Sensation:
      - Inner legs, hamstrings, spine
      - Broad opening and release through hips
  - Name: Sphinx
    Duration: 3
    Description: |
      Lie on the belly. Place elbows slightly forward of shoulders and rest onto forearms. Allow the
      belly to soften toward the floor.

      **Option:** Move elbows further forward to reduce intensity.

      **Counterpose:** Rest on belly, head turned right, right knee drawn up – 1 minute.
    Meridians:
      - Urinary Bladder
      - Kidney
      - Stomach
      - Spleen
    Sensation:
      - Lower back compression
      - Front body opening
  - Name: Seal
    Duration: 2
    Description: |
      Turn palms outward, straighten arms, and walk hands slightly toward body. Elbows may lock if
      comfortable.

      **Counterpose:** Rest on belly, head turned left, left knee drawn up – 1 minute.
    Meridians:
      - Urinary Bladder
      - Kidney
      - Stomach
      - Spleen
    Sensation:
      - Stronger compression in lumbar spine
      - Front torso opening
  - Name: "Swan – Right Side"
    Duration: 4
    Description: |
      From a prone position, bring the right knee forward and out to the side, lowering the shin toward
      horizontal. Left leg extends behind.

      **Full Swan:** 1 minute. Stay lifted on hands, feeling compression in the right hip.

      **Sleeping Swan:** 3 minutes. Fold the torso forward over the front leg. Rest on forearms or a bolster.

      **Counterpose:** Child's Pose – 1 minute.
    Meridians:
      - Liver
      - Kidney
      - Gallbladder
    Sensation:
      - Deep hip opening
      - Outer hip and glute
      - Emotional release
  - Name: "Swan – Left Side"
    Duration: 4
    Description: |
      Repeat on the left side.

      **Full Swan:** 1 minute. Stay lifted on hands.

      **Sleeping Swan:** 3 minutes. Fold the torso forward.

      **Rebound:** Shavasana – 1 minute.
    Meridians:
      - Liver
      - Kidney
      - Gallbladder
    Sensation:
      - Deep hip opening
      - Outer hip and glute
      - Emotional release
  - Name: Reclined Butterfly (Supta Baddha Konasana)
    Duration: 4
    Description: |
      Lie on the back with a bolster lengthwise under the spine. Soles of feet together, knees supported.

      **Rebound:** Shavasana – 1 minute.
    Meridians:
      - Heart
      - Lung
    Sensation:
      - Chest opening
      - Breath expansion
      - Deep relaxation
  - Name: "Reclined Twist – Right Side"
    Duration: 3
    Description: |
      Draw knees in, send right knee left, supported by bolster. Left leg relaxed long. Shoulders heavy.

      **Rebound:** Shavasana – 1 minute.
    Meridians:
      - Gallbladder
      - Urinary Bladder
      - Liver
    Sensation:
      - Detoxification
      - Emotional unwinding
      - Spinal release
  - Name: "Reclined Twist – Left Side"
    Duration: 3
    Description: |
      Repeat on opposite side.

      **Rebound:** Shavasana – 1 minute.
    Meridians:
      - Gallbladder
      - Urinary Bladder
      - Liver
    Sensation:
      - Detoxification
      - Emotional unwinding
      - Spinal release
  - Name: Final Shavasana
    Duration: 10
    Description: |
      Total rest. Allow the body to integrate the practice fully.

      Feel the echo of the postures. Rest deeply. Do nothing.
    Sensation:
      - Total integration
      - Deep rest
      - Complete surrender