Name: "Yin Yoga – Sesión de 60 Minutos"
Duration: 60
Description: |
  **Tema:** Arraigo · Hidratación de la Columna · Liberación del Cuerpo Inferior

  **Estilo:** Yin Clásico (pasivo, apoyado, quieto)

  Esta es una práctica con dominancia de los meridianos de Riñón, Vejiga Urinaria, Hígado y Corazón, con un fuerte énfasis en el arraigo, la hidratación de la columna, la calma del sistema nervioso y la liberación emocional.

  **Meridianos:** Riñón, Vejiga Urinaria, Hígado y Corazón son los meridianos primarios, con un fuerte énfasis en el arraigo, la hidratación de la columna, la calma del sistema nervioso y la liberación emocional.

Poses:



  - Name: Meditación Inicial
    Duration: 4
    Sensation:
      - Conciencia de la respiración
      - Arraigo
      - Transición del hacer al ser
    Description: |
      Llega en quietud. Permite que el cuerpo se asiente y la respiración se suavice.
      Invita a los participantes a establecer una intención para la práctica – una palabra, una cualidad o simple presencia.

      **Enfoque:**
      • Conciencia de la respiración
      • Arraigo
      • Transición del hacer al ser




  - Name: Colgante
    Duration: 3
    Meridians:
      - Vejiga Urinaria
      - Riñón
    Sensation:
      - Isquiotibiales, pantorrillas, columna, espalda baja
      - Descompresión suave de la columna
      - Aquietamiento de la mente
    Description: |
      De pie, coloca los pies a la anchura de las caderas. Inclínate lentamente hacia adelante desde las caderas
      y permite que la parte superior del cuerpo se libere por completo. Deja que la cabeza y el cuello cuelguen pesados.
      Las rodillas pueden doblarse profundamente. Las manos pueden descansar sobre bloques, un bolster, o colgar libremente.

      Esta es una forma pasiva – permite que la gravedad cree una tracción suave a través de la columna.

      **Meridianos y enfoque energético:**
        • Primario: Vejiga Urinaria, Riñón
        • Secundario: Sistema nervioso (parasimpático)

      **Sensación y conciencia:**
          • Isquiotibiales, pantorrillas, columna, espalda baja
          • Descompresión suave de la columna
          • Aquietamiento de la mente

      **Recordatorio Yin:** La incomodidad está bien. El dolor es una señal para ajustar o salir de la postura.

      ### Rebote – 1–2 minutos
        Levántate lentamente apilando la columna, o descansa en descanso constructivo.
        Observa el calor, la pulsación o el movimiento sutil a lo largo de la columna y las piernas.




  - Name: Cuclillas Apoyada (Malasana)
    Duration: 3
    Description: |
      Pies más anchos que las caderas, dedos apuntando ligeramente hacia afuera. Dobla las rodillas y baja las caderas hacia el suelo.
      Los talones pueden estar apoyados. Siéntate en un bloque o bolster si es necesario. Los codos pueden descansar dentro de las rodillas.

      Permite que la pelvis se hunda pesadamente. Sin esfuerzo por mantener la postura.

      **Recordatorio Yin:** Nos suavizamos hacia la sensación – no forzamos la profundidad.
    Meridians:
      - Riñón
      - Hígado
      - Bazo
      - Vesícula Biliar
    Sensation:
      - Tobillos, rodillas, caderas, ingles
      - Compresión a través de la pelvis
      - Arraigo y estabilidad



  - Name: "Libélula – Lado Derecho"
    Duration: 4
    Description: |
      Desde una posición sentada con piernas abiertas, dóblate sobre la pierna derecha. Permite que el torso
      se libere pasivamente hacia la pierna derecha sin tirar.

      **Contrapostura:** Limpiaparabrisas – 1 minuto.
    Meridians:
      - Hígado
      - Riñón
      - Vejiga Urinaria
    Sensation:
      - Piernas interiores, isquiotibiales, columna
      - Apertura amplia y liberación a través de las caderas



  - Name: "Libélula – Lado Izquierdo"
    Duration: 4
    Description: |
      Dóblate sobre la pierna izquierda. Permite que el torso se libere pasivamente hacia la pierna izquierda sin tirar.

      **Contrapostura:** Limpiaparabrisas – 1 minuto.
    Meridians:
      - Hígado
      - Riñón
      - Vejiga Urinaria
    Sensation:
      - Piernas interiores, isquiotibiales, columna
      - Apertura amplia y liberación a través de las caderas



  - Name: "Libélula – Centro"
    Duration: 4
    Description: |
      Dóblate hacia adelante por el centro del espagat. Permite que la columna se redondee y el torso se derrita
      hacia el suelo.

      **Contrapostura:** Limpiaparabrisas – 1 minuto.
    Meridians:
      - Hígado
      - Riñón
      - Vejiga Urinaria
    Sensation:
      - Piernas interiores, isquiotibiales, columna
      - Apertura amplia y liberación a través de las caderas



  - Name: Esfinge
    Duration: 4
    Description: |
      Recuéstate boca abajo. Coloca los codos ligeramente adelante de los hombros y descansa sobre los antebrazos.
      Permite que el vientre se suavice hacia el suelo.

      **Opción:** Mueve los codos más hacia adelante para reducir la intensidad.

      **Contrapostura:** Descansa boca abajo, cabeza girada a la derecha, rodilla derecha levantada – 1 minuto.
    Meridians:
      - Vejiga Urinaria
      - Riñón
      - Estómago
      - Bazo
    Sensation:
      - Compresión en la espalda baja
      - Apertura del cuerpo frontal



  - Name: Foca
    Duration: 2
    Description: |
      Gira las palmas hacia afuera, estira los brazos y camina las manos ligeramente hacia el cuerpo. Los codos
      pueden bloquearse si es cómodo.

      **Contrapostura:** Descansa boca abajo, cabeza girada a la izquierda, rodilla izquierda levantada – 1 minuto.
    Meridians:
      - Vejiga Urinaria
      - Riñón
      - Estómago
      - Bazo
    Sensation:
      - Mayor compresión en la columna lumbar
      - Apertura del torso frontal



  - Name: "Cisne – Lado Derecho"
    Duration: 5
    Description: |
      Desde una posición boca abajo, lleva la rodilla derecha hacia adelante y hacia el lado, bajando la espinilla
      hacia horizontal. La pierna izquierda se extiende hacia atrás.

      **Cisne completo:** 1 minuto. Permanece levantado sobre las manos, sintiendo la compresión en la cadera derecha.

      **Cisne durmiente:** 3 minutos. Dobla el torso hacia adelante sobre la pierna delantera. Descansa sobre los antebrazos o un bolster.

      **Contrapostura:** Postura del niño – 1 minuto.
    Meridians:
      - Hígado
      - Riñón
      - Vesícula Biliar
    Sensation:
      - Apertura profunda de cadera
      - Cadera exterior y glúteo
      - Liberación emocional



  - Name: "Cisne – Lado Izquierdo"
    Duration: 5
    Description: |
      Repite en el lado izquierdo.

      **Cisne completo:** 1 minuto. Permanece levantado sobre las manos.

      **Cisne durmiente:** 3 minutos. Dobla el torso hacia adelante.

      **Rebote:** Shavasana – 1 minuto.
    Meridians:
      - Hígado
      - Riñón
      - Vesícula Biliar
    Sensation:
      - Apertura profunda de cadera
      - Cadera exterior y glúteo
      - Liberación emocional



  - Name: Mariposa Reclinada (Supta Baddha Konasana)
    Duration: 5
    Description: |
      Recuéstate boca arriba con un bolster a lo largo debajo de la columna. Plantas de los pies juntas, rodillas apoyadas.

      **Rebote:** Shavasana – 1 minuto.
    Meridians:
      - Corazón
      - Pulmón
    Sensation:
      - Apertura del pecho
      - Expansión de la respiración
      - Relajación profunda



  - Name: "Torsión Reclinada – Lado Derecho"
    Duration: 3
    Description: |
      Lleva las rodillas hacia adentro, envía la rodilla derecha a la izquierda, apoyada por el bolster. Pierna izquierda relajada y larga. Hombros pesados.

      **Rebote:** Shavasana – 1 minuto.
    Meridians:
      - Vesícula Biliar
      - Vejiga Urinaria
      - Hígado
    Sensation:
      - Desintoxicación
      - Desenredo emocional
      - Liberación de la columna



  - Name: "Torsión Reclinada – Lado Izquierdo"
    Duration: 3
    Description: |
      Repite en el lado contrario.

      **Rebote:** Shavasana – 1 minuto.
    Meridians:
      - Vesícula Biliar
      - Vejiga Urinaria
      - Hígado
    Sensation:
      - Desintoxicación
      - Desenredo emocional
      - Liberación de la columna



  - Name: Shavasana Final
    Duration: 11
    Description: |
      Descanso total. Permite que el cuerpo integre la práctica por completo.

      Siente el eco de las posturas. Descansa profundamente. No hagas nada.
    Sensation:
      - Integración total
      - Descanso profundo
      - Rendición completa