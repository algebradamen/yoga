Name: "Yin Yoga"
Duration: 60
Description: |
  **Tema:** Corazón · Pulmón · Riñón · Vejiga Urinaria · Vesícula Biliar

  **Meridianos primarios:** Corazón, Pulmón.

  **Apoyo:** Riñón, Vejiga Urinaria, Vesícula Biliar, Hígado.

Poses:



  - Name: Aterrizaje
    Duration: 5
    Description: |
      Bienvenido/a a esta sesión de Yin Yoga de 60 minutos. Encuentra una posición cómoda, quizás sobre un bolster o cojín. Cierra los ojos y toma algunas respiraciones profundas. Siente el contacto con el suelo y deja que tu cuerpo aterrice en el momento presente.
      Invita una sensación de calma y presencia. Establece una intención para tu práctica de hoy – ¿qué deseas abrir, o soltar?

      Respiramos por la nariz y exhalamos por la nariz. Deja que la respiración sea natural y sin esfuerzo, y deja que el cuerpo se ablande con cada exhalación.
      La práctica de hoy se enfoca en abrir el espacio del corazón y los pulmones, mientras apoyamos los riñones y la vejiga urinaria para una sensación más profunda de calma y arraigo.

      Tomamos unas respiraciones y establecemos nuestra intención para la sesión antes de hacer om juntos tres veces y comenzar la práctica. (una pequeña pausa con tres respiraciones para la intención de la práctica).
      Inhala antes de ohm, y exhala cuando ohm, y repite esto tres veces.
    Sensation:
      - Calma y presencia
      - Conciencia de la respiración
      - Establecimiento de intención



  - Name: Colgante
    Duration: 4
    Description: |
      De pie con los pies a una distancia cómoda. Dobla las rodillas y dobla hacia adelante. Deja que los brazos y la cabeza cuelguen pesados.
      Descansa las manos sobre un bolster o bloques como apoyo si lo deseas. Deja que el peso de la cabeza y los brazos te lleven más profundo en el doblez, y siente cómo la columna se libera y se abre.
    Rebound:
      Duration: 0.5
      Description: Dobla las rodillas, suelta los brazos y levántate lentamente. De pie erguido/a.
    Meridians:
      - Vejiga Urinaria
      - Riñón
    Sensation:
      - Liberación de la columna
      - Arraigo del sistema nervioso
      - Apertura de la parte posterior del cuerpo
    Transition: De pie a Sentadilla. Nos quedamos de pie y nos preparamos para bajar a una sentadilla profunda.



  - Name: Sentadilla
    Duration: 3
    Description: |
      Comienza de pie con los pies a la anchura de las caderas, los dedos apuntando ligeramente hacia afuera. Dobla las rodillas y baja a una sentadilla profunda. Deja que los codos presionen las rodillas hacia los lados para abrir las caderas.
      Mantén la columna larga y el pecho abierto. Ten las manos en posición de oración frente al corazón con los codos presionando contra las espinillas o las rodillas. Deja que el peso del cuerpo se hunda en el suelo y siente una apertura profunda en las caderas.
      Crea estabilidad y arraigo – preparación para la apertura del corazón.
    Adjustments: Si es difícil mantener los talones en el suelo, puedes colocar una esterilla enrollada o una manta debajo de ellos como apoyo.
      **Rebound:** De pie erguido/a durante 0,5 min.
    Meridians:
      - Hígado
      - Riñón
    Sensation:
      - Arraigo
      - Estabilidad pélvica
      - Apertura del muslo interior
    Transition: De pie a Oruga. Nos sentamos y estiramos las piernas frente a nosotros.



  - Name: Oruga
    Duration: 4
    Description: |
      Piernas estiradas hacia adelante, dejando que el torso descanse relajado hacia adelante, quizás sobre un bolster.
      Soltando tensiones en la espalda y las caderas. Sin estiramiento activo – deja que la gravedad haga el trabajo.
    Rebound:
      Description: Tumbarse de espaldas (shavasana)
      Duration: 1

    Meridians:
      - Riñón
      - Vejiga Urinaria
    Sensation:
      - Apertura de la espalda y las caderas
      - Liberación de la cadena posterior
      - Arraigo
    Transition: Desde shavasana nos tumbamos de lado y nos preparamos para la mariposa reclinada. Coloca un bolster en posición longitudinal bajo la espalda, y opcionalmente construye con bloques si necesitas subir más.



  - Name: Mariposa Reclinada (Supta Baddha Konasana)
    Duration: 4
    Description: |
      Tumbado/a de espaldas con un bolster en posición longitudinal bajo la espalda, rodillas hacia los lados
      mientras las plantas de los pies están juntas. Deja que el pecho se abra. Siéntete libre de añadir bloques bajo las rodillas para más apoyo y apertura.

    Rebound:
      Description: Tumbarse de lado en posición fetal antes de incorporarse a una posición sentada.
      Duration: 0.5
    Meridians:
      - Corazón
      - Pulmón
    Sensation:
      - Apertura del pecho y el corazón
      - Respiración que eleva el corazón
      - Liberación en la ingle
    Transition: Rueda sobre el abdomen y retira el bolster. Prepárate para la postura del pez.

  - Name: Pez
    Duration: 4
    Description: |
      Abre el pecho y la garganta. Apoya con un bolster bajo la parte superior de la espalda para una versión Yin suave.
      Las palmas miran hacia abajo y los brazos están estirados y colocados bajo la pelvis. Inclina la cabeza hacia atrás.
      Deja que el pecho se abra y la respiración se mueva hacia el espacio del corazón.

    Rebound:
      Description: Tumbarse completamente de espaldas. Observa la respiración y cómo se siente el cuerpo después de la postura del pez.
      Duration: 0.5
    Meridians:
      - Corazón
      - Pulmón
    Sensation:
      - Expansión en el pecho
      - Apertura de la garganta
      - La respiración se profundiza naturalmente
    Transition: Desde shavasana túmbate boca abajo y prepárate para la postura de la esfinge.



  - Name: Esfinge
    Duration: 4
    Description: |
      Túmbate boca abajo. Coloca los codos ligeramente delante de los hombros y descansa sobre los antebrazos.
      Deja que el abdomen se funda hacia el suelo. Nota cómo se siente en la zona lumbar. Si la "sensación" es demasiado profunda, mueve los codos ligeramente hacia adelante para menos compresión, o tíralos ligeramente hacia atrás para más compresión.
      Puedes apoyarte con un bolster bajo el pecho para más apoyo y una apertura más suave.

      Observa la respiración moviéndose hacia las costillas superiores y el espacio del corazón.
    Rebound:
      Description: Túmbate completamente boca abajo, gira la cabeza hacia la derecha y arrastra la rodilla derecha hacia arriba a lo largo del suelo
      Duration: 1

    Meridians:
      - Vejiga Urinaria
      - Riñón
      - Estómago
      - Bazo
    Sensation:
      - Compresión en la zona lumbar
      - Apertura del espacio del corazón
      - Conciencia de la respiración en las costillas superiores


  - Name: Esfinge – Variación Foca
    Duration: 4
    Description: |
      Estira los brazos más hacia afuera para una flexión de espalda más profunda y compresión.
      Mantén los hombros relajados alejados de las orejas.
    Rebound:
      Description: Túmbate completamente boca abajo, gira la cabeza hacia la izquierda y arrastra la rodilla izquierda hacia arriba a lo largo del suelo
      Duration: 1
    Meridians:
      - Vejiga Urinaria
      - Riñón
      - Estómago
      - Bazo
    Sensation:
      - Compresión lumbar más profunda
      - Apertura de la región abdominal
      - Calor en el núcleo
    Transition: Rueda sobre la espalda y prepárate para el puente apoyado. Coloca un bolster o bloque bajo el sacro como apoyo.


  - Name: Puente Apoyado
    Duration: 4
    Description:
      Comienza tumbado/a de espaldas con las rodillas dobladas. Eleva las caderas lo suficiente para colocar un bloque bajo el sacro para el puente apoyado.
      Deja que el cuerpo se hunda en el bloque y respira a lo largo de la espalda. Ahora puedes extender los brazos hacia los lados y alejar los pies de la pelvis para estirarlos.

    Rebound:
      Description: Retira el bloque y aprieta las rodillas juntas durante 0,5 min.
      Duration: 0.5
    Meridians:
      - Riñón
      - Vejiga Urinaria
    Sensation:
      - Apertura de los flexores de cadera
      - Apoyo en la región sacra
      - Calma en la zona lumbar
    Transition: Rueda sobre el abdomen y prepárate para la postura del cisne.


  - Name: "Cisne – Lado Derecho"
    Duration: 5
    Description: |
      Comienza en el perro boca abajo. Estira la pierna derecha y lleva la rodilla derecha hacia adelante entre los brazos y recuéstate hacia el lado derecho.
      Comprueba cómo se siente en tu rodilla. Si se siente bien en la rodilla, puedes flexionar el pie derecho y dejar que el talón descanse en el suelo.
      Si se siente incómodo en la rodilla, puedes mantener el pie flexionado y dejar que el talón se eleve ligeramente del suelo.
      La pierna izquierda se estira hacia atrás con los dedos de los pies en el suelo. Deja que el torso se incline hacia adelante y deja que los brazos te apoyen.
      Si quieres una apertura más profunda puedes intentar el cisne completo elevándote sobre las manos y dejando que la compresión en la cadera aumente. Si prefieres una apertura más tranquila y meditativa, puedes intentar el cisne durmiente doblando el torso hacia adelante sobre la pierna delantera.

      **Cisne Completo:** 3 minutos. Elevado/a sobre las manos, compresión en la cadera derecha.

      **Cisne Durmiente:** 1 minuto. Dobla el torso hacia adelante sobre la pierna delantera.
    Rebound:
      Description: Postura del niño
      Duration: 1

    Meridians:
      - Vesícula Biliar
      - Hígado
    Sensation:
      - Apertura profunda de cadera
      - Liberación emocional
      - Rotación en la articulación de la cadera



  - Name: "Cisne – Lado Izquierdo"
    Duration: 5
    Description: |
      Comienza en el perro boca abajo. Estira la pierna izquierda y lleva la rodilla izquierda hacia adelante entre los brazos y recuéstate hacia el lado izquierdo.
      Comprueba cómo se siente en tu rodilla. Si se siente bien en la rodilla, puedes flexionar el pie izquierdo y dejar que el talón descanse en el suelo.
      Si se siente incómodo en la rodilla, puedes mantener el pie flexionado y dejar que el talón se eleve ligeramente del suelo.
      La pierna derecha se estira hacia atrás con los dedos de los pies en el suelo. Deja que el torso se incline hacia adelante y deja que los brazos te apoyen.
      Si quieres una apertura más profunda puedes intentar el cisne completo elevándote sobre las manos y dejando que la compresión en la cadera aumente. Si prefieres una apertura más tranquila y meditativa, puedes intentar el cisne durmiente doblando el torso hacia adelante sobre la pierna delantera.
      **Cisne Completo:** 3 minutos. Elevado/a sobre las manos, compresión en la cadera izquierda.

      **Cisne Durmiente:** 1 minuto. Dobla el torso hacia adelante sobre la pierna delantera.

    Rebound:
      Description: Postura del niño
      Duration: 1
    Meridians:
    - Vesícula Biliar
    - Hígado
    Sensation:
      - Apertura profunda de cadera
      - Liberación emocional
      - Rotación en la articulación de la cadera
    Transition: Rueda y túmbate de espaldas para prepararte para la torsión reclinada. Coloca un bolster en el lado derecho del cuerpo como apoyo durante la torsión.


  - Name: "Torsión Reclinada – Lado Derecho"
    Duration: 3
    Description: |
      Lleva las rodillas hacia el pecho y envía la rodilla izquierda al lado derecho del cuerpo, apoyada en un bolster si lo deseas.
      Abre los brazos como dos alas y deja que el peso de las rodillas y el torso creen una suave torsión en la columna.
      Deja que la cabeza descanse en el suelo o gírala en la dirección opuesta a las rodillas para una torsión más profunda.
      Ambos hombros descansan en el suelo.

    Rebound:
      Description: Shavasana, observa la respiración y cómo se siente el cuerpo después de la torsión.
      Duration: 0.5
    Meridians:
      - Vesícula Biliar
      - Vejiga Urinaria
      - Corazón
      - Pulmón
    Sensation:
      - Desintoxicación
      - Desenrollamiento emocional a través de la rotación espinal
      - Ligereza en el pecho



  - Name: "Torsión Reclinada – Lado Izquierdo"
    Duration: 3
    Description: |
      Lleva las rodillas hacia el pecho y envía la rodilla derecha al lado izquierdo del cuerpo, apoyada en un bolster si lo deseas.
      Abre los brazos como dos alas y deja que el peso de las rodillas y el torso creen una suave torsión en la columna.
      Deja que la cabeza descanse en el suelo o gírala en la dirección opuesta a las rodillas para una torsión más profunda.
      Ambos hombros descansan en el suelo.
    Rebound:
      Description: Shavasana, observa la respiración y cómo se siente el cuerpo después de la torsión.
      Duration: 0.5
    Meridians:
      - Vesícula Biliar
      - Vejiga Urinaria
      - Corazón
      - Pulmón
    Sensation:
      - Desintoxicación
      - Desenrollamiento emocional a través de la rotación espinal
      - Ligereza en el pecho



  - Name: Shavasana
    Duration: 8
    Description: |
      Tiempo para descansar. Shavasana es el cierre de tu práctica, una parte natural del viaje. Deja que el cuerpo se hunda en el suelo y que la respiración sea natural y sin esfuerzo.
        Deja que el cuerpo y la mente se fundan. Observa la energía y lo que se ha abierto durante la práctica.
        Siente cómo se siente estar en tu cuerpo ahora mismo, y deja que crezca una sensación de gratitud por ti mismo/a y tu práctica.
        Un pequeño mantra de gratitud.
         "Estoy agradecido/a por mi cuerpo y mi práctica. Estoy abierto/a a lo que se ha abierto en mí hoy, y llevo esta calma y apertura conmigo."
         "Estoy agradecido/a por el amor y el apoyo en mi espacio del corazón. Estoy abierto/a a dar y recibir amor en todos los aspectos de mi vida."
         "Que mis pensamientos, palabras y acciones estén llenos de amor y compasión. Estoy agradecido/a por la oportunidad de abrir mi corazón y compartir mi amor con el mundo."
    Sensation:
      - Descanso completo e integración
      - Respiración sin esfuerzo
      - Suavidad en el espacio del corazón
