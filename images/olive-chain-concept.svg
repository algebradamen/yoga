<svg width="340" height="100" viewBox="0 0 340 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Olive chain concept with leaves</title>
  <desc>Original olive branch illustration for the green header corner.</desc>

  <defs>
    <linearGradient id="olive-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8e6a0"/>
      <stop offset="1" stop-color="#78964b"/>
    </linearGradient>
    <linearGradient id="olive-fruit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9b879"/>
      <stop offset="1" stop-color="#536b3b"/>
    </linearGradient>
  </defs>

  <!-- Two branches form a compact, natural chain within the header corner. -->
  <path d="M18 88C56 71 84 77 119 59C153 42 186 52 218 36C251 20 284 29 325 11"
        stroke="#3f5d2f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M23 95C65 80 91 86 126 69C158 54 188 63 221 47C255 31 286 39 322 23"
        stroke="#6f8c45" stroke-width="1.5" stroke-linecap="round" opacity=".9"/>

  <!-- Alternating olive leaves. -->
  <g fill="url(#olive-leaf)" stroke="#415e31" stroke-width=".7">
    <ellipse cx="45" cy="76" rx="15" ry="4.5" transform="rotate(-29 45 76)"/>
    <ellipse cx="70" cy="72" rx="14" ry="4.3" transform="rotate(28 70 72)"/>
    <ellipse cx="96" cy="68" rx="15" ry="4.5" transform="rotate(-31 96 68)"/>
    <ellipse cx="119" cy="57" rx="14" ry="4.3" transform="rotate(25 119 57)"/>
    <ellipse cx="145" cy="50" rx="15" ry="4.5" transform="rotate(-30 145 50)"/>
    <ellipse cx="170" cy="49" rx="14" ry="4.3" transform="rotate(26 170 49)"/>
    <ellipse cx="196" cy="42" rx="15" ry="4.5" transform="rotate(-30 196 42)"/>
    <ellipse cx="222" cy="34" rx="14" ry="4.3" transform="rotate(27 222 34)"/>
    <ellipse cx="249" cy="28" rx="15" ry="4.5" transform="rotate(-27 249 28)"/>
    <ellipse cx="276" cy="29" rx="14" ry="4.3" transform="rotate(27 276 29)"/>
    <ellipse cx="301" cy="20" rx="15" ry="4.5" transform="rotate(-25 301 20)"/>
  </g>

  <!-- Larger, shaded olives distinguish the fruit from the foliage. -->
  <g fill="url(#olive-fruit)" stroke="#334727" stroke-width=".9">
    <ellipse cx="82" cy="69" rx="6.2" ry="7.2" transform="rotate(-18 82 69)"/>
    <ellipse cx="155" cy="48" rx="6.2" ry="7.2" transform="rotate(16 155 48)"/>
    <ellipse cx="231" cy="34" rx="6.2" ry="7.2" transform="rotate(-15 231 34)"/>
    <ellipse cx="291" cy="25" rx="6.2" ry="7.2" transform="rotate(18 291 25)"/>
  </g>

  <g stroke="#eef3d7" stroke-width="1" stroke-linecap="round" opacity=".65">
    <path d="M38 78L56 71"/>
    <path d="M86 70L106 63"/>
    <path d="M136 54L156 47"/>
    <path d="M187 45L207 38"/>
    <path d="M240 31L260 25"/>
    <path d="M291 23L310 16"/>
  </g>
</svg>
