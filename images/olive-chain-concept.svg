<svg width="340" height="100" viewBox="0 0 340 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Olive chain concept with leaves</title>
  <desc>Original olive branch illustration for the green header corner.</desc>

  <defs>
    <linearGradient id="olive-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8e6a0"/>
      <stop offset="1" stop-color="#78964b"/>
    </linearGradient>
    <linearGradient id="olive-fruit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9b879"/>
      <stop offset="1" stop-color="#536b3b"/>
    </linearGradient>
  </defs>

  <!-- Two branches form a compact, natural chain within the header corner. -->
  <path d="M18 28C42 24 68 34 94 27C119 21 143 33 169 27C195 22 218 35 244 29C270 24 296 38 325 32"
        stroke="#3f5d2f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M23 35C49 31 75 42 101 34C128 28 151 40 177 34C202 29 226 42 251 36C276 31 300 45 322 39"
        stroke="#6f8c45" stroke-width="1.5" stroke-linecap="round" opacity=".9"/>

  <!-- Alternating olive leaves. -->
  <g fill="url(#olive-leaf)" stroke="#415e31" stroke-width=".7">
    <ellipse cx="45" cy="29" rx="15" ry="4.5" transform="rotate(-10 45 29)"/>
    <ellipse cx="70" cy="31" rx="14" ry="4.3" transform="rotate(18 70 31)"/>
    <ellipse cx="96" cy="27" rx="15" ry="4.5" transform="rotate(-10 96 27)"/>
    <ellipse cx="119" cy="26" rx="14" ry="4.3" transform="rotate(17 119 26)"/>
    <ellipse cx="145" cy="29" rx="15" ry="4.5" transform="rotate(-10 145 29)"/>
    <ellipse cx="170" cy="27" rx="14" ry="4.3" transform="rotate(16 170 27)"/>
    <ellipse cx="196" cy="28" rx="15" ry="4.5" transform="rotate(-9 196 28)"/>
    <ellipse cx="222" cy="31" rx="14" ry="4.3" transform="rotate(16 222 31)"/>
    <ellipse cx="249" cy="30" rx="15" ry="4.5" transform="rotate(-8 249 30)"/>
    <ellipse cx="276" cy="35" rx="14" ry="4.3" transform="rotate(15 276 35)"/>
    <ellipse cx="301" cy="32" rx="15" ry="4.5" transform="rotate(-8 301 32)"/>
  </g>

  <!-- Larger, shaded olives distinguish the fruit from the foliage. -->
  <g fill="url(#olive-fruit)" stroke="#334727" stroke-width=".9">
    <ellipse cx="82" cy="30" rx="6.2" ry="7.2" transform="rotate(-18 82 30)"/>
    <ellipse cx="155" cy="28" rx="6.2" ry="7.2" transform="rotate(16 155 28)"/>
    <ellipse cx="231" cy="31" rx="6.2" ry="7.2" transform="rotate(-15 231 31)"/>
    <ellipse cx="291" cy="34" rx="6.2" ry="7.2" transform="rotate(18 291 34)"/>
  </g>

  <g stroke="#eef3d7" stroke-width="1" stroke-linecap="round" opacity=".65">
    <path d="M38 31L56 27"/>
    <path d="M86 33L106 28"/>
    <path d="M136 32L156 27"/>
    <path d="M187 33L207 28"/>
    <path d="M240 35L260 30"/>
    <path d="M291 39L310 34"/>
  </g>
</svg>
