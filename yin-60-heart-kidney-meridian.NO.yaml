Name: "Yin Yoga – Hjerte- og Nyremeridianer"
Duration: 60
Description: |
  **Tema:** Forankring av hjertet · Åpning av pusten · Emosjonell balanse
  **Primære meridianer:** Hjerte, Lunge
  **Sekundær støtte:** Nyre, Urinblære

Poses:
  - Name: Åpningsmeditasjon
    Duration: 3
    Description: |
      Ankomst i stillhet. Kjenn vekten av kroppen støttet av bakken.
      Inviter bevisstheten til den naturlige rytmen av pusten – uten å endre den.
      Sett en intensjon knyttet til hjertet: åpenhet, medfølelse eller tilstedeværelse.
    Sensation:
      - Forankrethet
      - Hjertbevissthet
      - Myknet pust
  - Name: Hengende fremoverfold
    Duration: 3
    Description: |
      Stående fremoverfold – Yin-versjon. Forankre nervesystemet før du åpner brystet og pusten.

      **Rebound:** Konstruktiv hvile eller stående pause – 1–2 minutter.
    Meridians:
      - Urinblære
      - Nyre
    Sensation:
      - Ryggradsfrigjøring
      - Forankring av nervesystemet
      - Åpning av baksiden av kroppen
  - Name: Støttet huk (Malasana)
    Duration: 3
    Description: |
      Skaper stabilitet og forankring – som forberedelse til hjerte-åpning senere.

      **Rebound:** Sittende stillhet – 1 minutt.
    Meridians:
      - Nyre
      - Lever
      - Milt
    Sensation:
      - Forankring
      - Bekkenstabilitet
      - Frigjøring av indre lår
  - Name: "Øyenstikker – Høyre side"
    Duration: 3
    Description: |
      Fra et bredt sittende spredt bein, fold over det høyre benet. Hold ryggraden avslappet – ingen trekking.
      La pusten vide ut ryggradsribbeina.

      **Motposisjon:** Vindusvisker – 1 minutt.
    Meridians:
      - Lever
      - Nyre
      - Urinblære
    Sensation:
      - Indre lår, hamstrings
      - Pust som vider ut ryggradsribbeina
  - Name: "Øyenstikker – Venstre side"
    Duration: 3
    Description: |
      Fold over det venstre benet. Hold ryggraden avslappet – ingen trekking.
      La pusten vide ut ryggradsribbeina.

      **Motposisjon:** Vindusvisker – 1 minutt.
    Meridians:
      - Lever
      - Nyre
      - Urinblære
    Sensation:
      - Indre lår, hamstrings
      - Pust som vider ut ryggradsribbeina
  - Name: "Øyenstikker – Midten"
    Duration: 3
    Description: |
      Fold forover ned midten. Hold ryggraden avslappet – ingen trekking.
      La pusten vide ut ryggradsribbeina.

      **Motposisjon:** Vindusvisker – 1 minutt.
    Meridians:
      - Lever
      - Nyre
      - Urinblære
    Sensation:
      - Indre lår, hamstrings
      - Pust som vider ut ryggradsribbeina
  - Name: Sfinks
    Duration: 3
    Description: |
      Ligg på magen. Plasser albuene litt foran skuldrene og hvil på underarmene. La
      magen mykne mot gulvet.

      Legg merke til pusten som beveger seg inn i de øvre ribbeina og hjerterommet.

      **Motposisjon:** Hvil på magen, hodet vendt til høyre, høyre kne trukket opp – 1 minutt.
    Meridians:
      - Urinblære
      - Nyre
      - Lunge
      - Hjerte
    Sensation:
      - Kompresjon i korsryggen
      - Åpning av hjerterommet
      - Pusten dypner inn i de øvre ribbeina
  - Name: Støttet fisk
    Duration: 4
    Description: |
      Ligg bakover over en bolster plassert horisontalt under øvre rygg og hjerte.
      Hodet og nakken støttet. Bena strakt eller bøyd, armene åpner seg vidt med håndflatene opp.

      **Yin-påminnelse:** Støtte er essensielt – denne stillingen skal føles *holdt*, ikke anstrengt.

      **Rebound:** Shavasana eller konstruktiv hvile – 1 minutt.
    Meridians:
      - Hjerte
      - Lunge
    Sensation:
      - Ekspansjon over bryst, nøkkelben, skuldre
      - Pusten dypner naturlig
      - Emosjonell åpenhet eller sårbarhet kan oppstå

  - Name: "Svane – Høyre side"
    Duration: 4
    Description: |
      Bring høyre kne frem og ut til siden, venstre bein strekkes bak.

      **Full svane:** 1 minutt. Bli løftet på hender, kompresjon i høyre hofte.

      **Sovende svane:** 3 minutter. Fold overkroppen forover over det fremre benet.

      **Motposisjon:** Barnets positur – 1 minutt.
    Meridians:
      - Lever
      - Galleblære
    Sensation:
      - Dyp hofteåpning
      - Emosjonell frigjøring før hjertearbeid
  - Name: "Svane – Venstre side"
    Duration: 4
    Description: |
      Gjenta på venstre side.

      **Full svane:** 1 minutt.

      **Sovende svane:** 3 minutter.

      **Rebound:** Shavasana – 1 minutt.
    Meridians:
      - Lever
      - Galleblære
    Sensation:
      - Dyp hofteåpning
      - Emosjonell frigjøring før hjertearbeid
  - Name: Smeltende hjerte (Anahatasana)
    Duration: 4
    Description: |
      Fra bordhunds positur, hold hoftene over knærne og smelt sakte brystet mot gulvet.
      Panne eller hake hviler på støtte. Armene strakte eller bøyde.

      **Rebound:** Barnets positur – 1 minutt.
    Meridians:
      - Lunge
      - Hjerte
    Sensation:
      - Bryst, skuldre, armhuler
      - Pustbevissthet – særlig innpust
  - Name: Liggende sommerfugl (Supta Baddha Konasana)
    Duration: 5
    Description: |
      Ligg bakover over en bolster på langs. Fotsålene mot hverandre, knærne støttet.
      Armene kan åpne seg vidt eller hvile på magen og hjertet.

      Kjenn pusten som forsiktig løfter hjertet.

      **Rebound:** Shavasana – 1 minutt.
    Meridians:
      - Hjerte
      - Lunge
    Sensation:
      - Dyp bryst- og hjerteåpning
      - Pusten løfter hjertet
      - Full overgivelse
  - Name: "Liggende vridning – Høyre side"
    Duration: 3
    Description: |
      Trekk knærne inn, send høyre kne til venstre, støttet av bolster.
      Venstre bein avslappet og langt. Skuldrene tunge.

      **Rebound:** Shavasana – 1 minutt.
    Meridians:
      - Galleblære
      - Urinblære
      - Hjerte
    Sensation:
      - Avgiftning
      - Emosjonell opprulling via skånsom ryggradsrotasjon
  - Name: "Liggende vridning – Venstre side"
    Duration: 3
    Description: |
      Gjenta på motsatt side.

      **Rebound:** Shavasana – 1 minutt.
    Meridians:
      - Galleblære
      - Urinblære
      - Hjerte
    Sensation:
      - Avgiftning
      - Emosjonell opprulling via skånsom ryggradsrotasjon
  - Name: Avsluttende Shavasana
    Duration: 9
    Description: |
      Total hvile. Inviter mykhet bak hjertet og en lett, uanstrengt pust.
      La effektene av øvelsen integreres fullt ut.
    Sensation:
      - Mykhet bak hjertet
      - Uanstrengt pust
      - Full integrasjon