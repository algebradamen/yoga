Name: "Yin Yoga – Meridianos del Corazón y Riñón"
Duration: 60
Description: |
  **Tema:** Arraigando el Corazón · Apertura de la Respiración · Equilibrio Emocional

  **Meridianos Primarios:** Corazón, Pulmón

  **Apoyo Secundario:** Riñón, Vejiga Urinaria

Poses:



  - Name: Meditación Inicial
    Duration: 3
    Description: |
      Llega en quietud. Siente el peso del cuerpo apoyado por el suelo.
      Invita la conciencia al ritmo natural de la respiración – sin cambiarlo.
      Establece una intención conectada al corazón: apertura, compasión o presencia.
    Sensation:
      - Arraigo
      - Conciencia del corazón
      - Suavización de la respiración



  - Name: Colgante
    Duration: 3
    Description: |
      Flexión de pie hacia adelante – versión Yin. Arraiga el sistema nervioso antes de abrir el pecho y la respiración.
    Rebound:
      Description: Descanso constructivo o pausa de pie
      Duration: 1
    Meridians:
      - Vejiga Urinaria
      - Riñón
    Sensation:
      - Liberación de la columna
      - Arraigo del sistema nervioso
      - Apertura de la cadena posterior



  - Name: Cuclillas Apoyada (Malasana)
    Duration: 3
    Description: |
      Crea estabilidad y arraigo – preparando para la apertura del corazón más adelante.
    Rebound:
      Description: Quietud sentada
      Duration: 1
    Meridians:
      - Riñón
      - Hígado
      - Bazo
    Sensation:
      - Arraigo
      - Estabilidad pélvica
      - Liberación de piernas interiores



  - Name: "Libélula – Lado Derecho"
    Duration: 3
    Description: |
      Desde una posición sentada con piernas abiertas, dóblate sobre la pierna derecha. Mantén la columna relajada – sin tirar.
      Permite que la respiración ensanche las costillas de la espalda.

      **Contrapostura:** Limpiaparabrisas – 1 minuto.
    Meridians:
      - Hígado
      - Riñón
      - Vejiga Urinaria
    Sensation:
      - Piernas interiores, isquiotibiales
      - Respiración expandiendo las costillas de la espalda



  - Name: "Libélula – Lado Izquierdo"
    Duration: 3
    Description: |
      Dóblate sobre la pierna izquierda. Mantén la columna relajada – sin tirar.
      Permite que la respiración ensanche las costillas de la espalda.

      **Contrapostura:** Limpiaparabrisas – 1 minuto.
    Meridians:
      - Hígado
      - Riñón
      - Vejiga Urinaria
    Sensation:
      - Piernas interiores, isquiotibiales
      - Respiración expandiendo las costillas de la espalda



  - Name: "Libélula – Centro"
    Duration: 3
    Description: |
      Dóblate hacia adelante por el centro. Mantén la columna relajada – sin tirar.
      Permite que la respiración ensanche las costillas de la espalda.

      **Contrapostura:** Limpiaparabrisas – 1 minuto.
    Meridians:
      - Hígado
      - Riñón
      - Vejiga Urinaria
    Sensation:
      - Piernas interiores, isquiotibiales
      - Respiración expandiendo las costillas de la espalda



  - Name: Esfinge
    Duration: 3
    Description: |
      Recuéstate boca abajo. Coloca los codos ligeramente adelante de los hombros y descansa sobre los antebrazos.
      Permite que el vientre se suavice hacia el suelo.

      Observa la respiración moviéndose hacia las costillas superiores y el espacio del corazón.

      **Contrapostura:** Descansa boca abajo, cabeza girada a la derecha, rodilla derecha levantada – 1 minuto.
    Meridians:
      - Vejiga Urinaria
      - Riñón
      - Pulmón
      - Corazón
    Sensation:
      - Compresión en la espalda baja
      - Apertura del espacio del corazón
      - Respiración profundizando hacia las costillas superiores



  - Name: Pez Apoyado
    Duration: 4
    Description: |
      Recuéstate sobre un bolster colocado horizontalmente debajo de la parte superior de la espalda y el corazón.
      Cabeza y cuello apoyados. Piernas extendidas o dobladas, brazos abriéndose ampliamente con las palmas hacia arriba.

      **Recordatorio Yin:** El apoyo es esencial – esta postura debe sentirse *sostenida*, no forzada.
    Rebound:
      Description: Shavasana o descanso constructivo
      Duration: 1
    Meridians:
      - Corazón
      - Pulmón
    Sensation:
      - Expansión a través del pecho, clavículas, hombros
      - Respiración profundizando naturalmente
      - Puede surgir apertura emocional o vulnerabilidad




  - Name: "Cisne – Lado Derecho"
    Duration: 4
    Description: |
      Lleva la rodilla derecha hacia adelante y hacia el lado, la pierna izquierda se extiende hacia atrás.

      **Cisne completo:** 1 minuto. Permanece levantado sobre las manos, compresión en la cadera derecha.

      **Cisne durmiente:** 3 minutos. Dobla el torso hacia adelante sobre la pierna delantera.

      **Contrapostura:** Postura del niño – 1 minuto.
    Meridians:
      - Hígado
      - Vesícula Biliar
    Sensation:
      - Apertura profunda de cadera
      - Liberación emocional antes del trabajo del corazón



  - Name: "Cisne – Lado Izquierdo"
    Duration: 4
    Description: |
      Repite en el lado izquierdo.

      **Cisne completo:** 1 minuto.

      **Cisne durmiente:** 3 minutos.
    Rebound:
      Description: Shavasana
      Duration: 1
    Meridians:
      - Hígado
      - Vesícula Biliar
    Sensation:
      - Apertura profunda de cadera
      - Liberación emocional antes del trabajo del corazón



  - Name: Corazón Derretido (Anahatasana)
    Duration: 4
    Description: |
      Desde la postura de la mesa, mantén las caderas sobre las rodillas y derrite lentamente el pecho hacia el suelo.
      La frente o el mentón descansan sobre un apoyo. Los brazos extendidos o doblados.
    Rebound:
      Description: Postura del niño
      Duration: 1
    Meridians:
      - Pulmón
      - Corazón
    Sensation:
      - Pecho, hombros, axilas
      - Conciencia de la respiración – especialmente la inhalación



  - Name: Mariposa Reclinada (Supta Baddha Konasana)
    Duration: 5
    Description: |
      Recuéstate sobre un bolster a lo largo. Plantas de los pies juntas, rodillas apoyadas.
      Los brazos pueden abrirse ampliamente o descansar sobre el vientre y el corazón.

      Siente la respiración levantando suavemente el corazón.
    Rebound:
      Description: Shavasana
      Duration: 1
    Meridians:
      - Corazón
      - Pulmón
    Sensation:
      - Apertura profunda del pecho y el corazón
      - Respiración elevando el corazón
      - Rendición completa



  - Name: "Torsión Reclinada – Lado Derecho"
    Duration: 3
    Description: |
      Lleva las rodillas hacia adentro, envía la rodilla derecha a la izquierda, apoyada por el bolster.
      Pierna izquierda relajada y larga. Hombros pesados.
    Rebound:
      Description: Shavasana
      Duration: 1
    Meridians:
      - Vesícula Biliar
      - Vejiga Urinaria
      - Corazón
    Sensation:
      - Desintoxicación
      - Desenredo emocional mediante rotación suave de la columna



  - Name: "Torsión Reclinada – Lado Izquierdo"
    Duration: 3
    Description: |
      Repite en el lado contrario.
    Rebound:
      Description: Shavasana
      Duration: 1
    Meridians:
      - Vesícula Biliar
      - Vejiga Urinaria
      - Corazón
    Sensation:
      - Desintoxicación
      - Desenredo emocional mediante rotación suave de la columna



  - Name: Shavasana Final
    Duration: 9
    Description: |
      Descanso total. Invita suavidad detrás del corazón y una respiración fácil y sin esfuerzo.
      Permite que los efectos de la práctica se integren plenamente.
    Sensation:
      - Suavidad detrás del corazón
      - Respiración sin esfuerzo
      - Integración completa