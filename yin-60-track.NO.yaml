Name: "Yin Yoga – 60-minutters økt"
Duration: 60
Description: |
  **Tema:** Forankring · Ryggradshydrering · Utslipp i nedre kropp

  **Stil:** Klassisk Yin (passiv, støttet, stille)

  Dette er en økt med dominans av Nyre-, Urinblære-, Lever- og Hjertemeridian, med sterk vekt på forankring, ryggradshydrering, ro i nervesystemet og emosjonell frigjøring.

  **Meridianer:** Nyre, Urinblære, Lever og Hjerte er de primære meridianene, med sterk vekt på forankring, ryggradshydrering, ro i nervesystemet og emosjonell frigjøring.

Poses:
  - Name: Åpningsmeditasjon
    Duration: 3
    Sensation: "Pustbevissthet · Forankring · Overgang fra å gjøre til å være"
    Description: |
      Ankomst i stillhet. La kroppen slå seg til ro og pusten mykne.
      Inviter deltakerne til å sette en intensjon for øvelsen – et ord, en kvalitet eller simpel tilstedeværelse.

      **Fokus:**
      • Pustbevissthet
      • Forankring
      • Overgang fra å gjøre til å være

  - Name: Hengende fremoverfold
    Duration: 3
    Meridians:
      - Urinblære
      - Nyre
    Sensation: "Hamstrings, legger, ryggrad, korsrygg · Skånsom ryggradsdekkompresjon · Stillhet i sinnet"
    Description: |
      Fra stående, plasser føttene hoftebrede fra hverandre. Heng sakte forover fra hoftene og la overkroppen
      slippe fullstendig. La hodet og nakken henge tungt. Knærne kan bøyes dypt. Hendene kan hvile
      på klosser, en bolster, eller henge fritt.

      Dette er en passiv form – la tyngdekraften skape skånsom traksjon gjennom ryggraden.

      **Meridianer og energetisk fokus:**
        • Primær: Urinblære, Nyre
        • Sekundær: Nervesystemet (parasympatisk)

      **Sensasjon og bevissthet:**
          • Hamstrings, legger, ryggrad, korsrygg
          • Skånsom ryggradsdekkompresjon
          • Stillhet i sinnet

      **Yin-påminnelse:** Ubehag er greit. Smerte er et signal om å justere eller komme ut av stillingen.

      ### Rebound – 1–2 minutter
        Stå langsomt opp, stakk ryggraden, eller hvil i konstruktiv hvile.
        Legg merke til varme, pulsering eller subtil bevegelse langs ryggraden og bena.

  - Name: Støttet huk (Malasana)
    Duration: 3
    Description: |
      Føttene bredere enn hoftene, tærne peker litt ut. Bøy knærne og senk hoftene mot gulvet.
      Hælene kan støttes. Sitt på en kloss eller bolster om nødvendig. Albuene kan hvile inni knærne.

      La bekkenet synke tungt. Ingen anstrengelse for å holde stillingen.

      **Yin-påminnelse:** Vi mykner inn i sensasjonen – vi tvinger ikke dybde.
    Meridians:
      - Nyre
      - Lever
      - Milt
      - Galleblære
    Sensation: "Ankler, knær, hofter, lysker · Kompresjon gjennom bekkenet · Forankring og stabilitet"

  - Name: "Øyenstikker – Høyre side"
    Duration: 3
    Description: |
      Fra et bredt sittende spredt bein, fold over det høyre benet. La overkroppen slippe passivt
      mot det høyre benet uten å trekke.

      **Motposisjon:** Vindusvisker – 1 minutt.
    Meridians:
      - Lever
      - Nyre
      - Urinblære
    Sensation: "Indre lår, hamstrings, ryggrad · Bred åpning og frigjøring gjennom hofter"

  - Name: "Øyenstikker – Venstre side"
    Duration: 3
    Description: |
      Fold over det venstre benet. La overkroppen slippe passivt mot det venstre benet uten å trekke.

      **Motposisjon:** Vindusvisker – 1 minutt.
    Meridians:
      - Lever
      - Nyre
      - Urinblære
    Sensation: "Indre lår, hamstrings, ryggrad · Bred åpning og frigjøring gjennom hofter"

  - Name: "Øyenstikker – Midten"
    Duration: 3
    Description: |
      Fold forover ned midten av spagaten. La ryggraden runde og overkroppen smelte
      mot gulvet.

      **Motposisjon:** Vindusvisker – 1 minutt.
    Meridians:
      - Lever
      - Nyre
      - Urinblære
    Sensation: "Indre lår, hamstrings, ryggrad · Bred åpning og frigjøring gjennom hofter"

  - Name: Sfinks
    Duration: 3
    Description: |
      Ligg på magen. Plasser albuene litt foran skuldrene og hvil på underarmene. La
      magen mykne mot gulvet.

      **Alternativ:** Flytt albuene lenger frem for å redusere intensiteten.

      **Motposisjon:** Hvil på magen, hodet vendt til høyre, høyre kne trukket opp – 1 minutt.
    Meridians:
      - Urinblære
      - Nyre
      - Mage
      - Milt
    Sensation: "Kompresjon i korsryggen · Åpning av forsiden av kroppen"

  - Name: Sel
    Duration: 2
    Description: |
      Vend håndflatene utover, rett ut armene og gå hendene litt mot kroppen. Albuene kan låses
      om det er komfortabelt.

      **Motposisjon:** Hvil på magen, hodet vendt til venstre, venstre kne trukket opp – 1 minutt.
    Meridians:
      - Urinblære
      - Nyre
      - Mage
      - Milt
    Sensation: "Sterkere kompresjon i korsryggen · Åpning av forsiden av overkroppen"

  - Name: "Svane – Høyre side"
    Duration: 4
    Description: |
      Fra liggende stilling, bring høyre kne frem og ut til siden, senk leggen mot horisontalen.
      Venstre bein strekkes bak.

      **Full svane:** 1 minutt. Bli løftet på hender, kjenn kompresjon i høyre hofte.

      **Sovende svane:** 3 minutter. Fold overkroppen forover over det fremre benet. Hvil på underarmer eller bolster.

      **Motposisjon:** Barnets positur – 1 minutt.
    Meridians:
      - Lever
      - Nyre
      - Galleblære
    Sensation: "Dyp hofteåpning · Ytre hofte og sete · Emosjonell frigjøring"

  - Name: "Svane – Venstre side"
    Duration: 4
    Description: |
      Gjenta på venstre side.

      **Full svane:** 1 minutt. Bli løftet på hender.

      **Sovende svane:** 3 minutter. Fold overkroppen forover.

      **Rebound:** Shavasana – 1 minutt.
    Meridians:
      - Lever
      - Nyre
      - Galleblære
    Sensation: "Dyp hofteåpning · Ytre hofte og sete · Emosjonell frigjøring"

  - Name: Liggende sommerfugl (Supta Baddha Konasana)
    Duration: 4
    Description: |
      Ligg på ryggen med en bolster på langs under ryggraden. Fotsålene mot hverandre, knærne støttet.

      **Rebound:** Shavasana – 1 minutt.
    Meridians:
      - Hjerte
      - Lunge
    Sensation: "Bryståpning · Pusteutvidelse · Dyp avslapning"

  - Name: "Liggende vridning – Høyre side"
    Duration: 3
    Description: |
      Trekk knærne inn, send høyre kne til venstre, støttet av bolster. Venstre bein avslappet og langt. Skuldrene tunge.

      **Rebound:** Shavasana – 1 minutt.
    Meridians:
      - Galleblære
      - Urinblære
      - Lever
    Sensation: "Avgiftning · Emosjonell opprulling · Ryggradsfrigjøring"

  - Name: "Liggende vridning – Venstre side"
    Duration: 3
    Description: |
      Gjenta på motsatt side.

      **Rebound:** Shavasana – 1 minutt.
    Meridians:
      - Galleblære
      - Urinblære
      - Lever
    Sensation: "Avgiftning · Emosjonell opprulling · Ryggradsfrigjøring"

  - Name: Avsluttende Shavasana
    Duration: 10
    Description: |
      Total hvile. La kroppen integrere øvelsen fullt ut.

      Kjenn ekkoet av stillingene. Hvil dypt. Gjør ingenting.
    Sensation: "Total integrasjon · Dyp hvile · Fullstendig overgivelse"
