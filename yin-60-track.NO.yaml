Name: "Yin Yoga – 60 minutter"
Duration: 60
Description: |
  **Tema:** Hjerte · Lunge · Nyre · Urinblære · Galleblære

  **Primære meridianer:** Hjerte, Lunge

  **Støtte:** Nyre, Urinblære, Galleblære, Lever

Poses:



  - Name: Landing
    Duration: 5
    Description: |
      Velkommen til denne 60 minutters Yin Yoga-økten. Sett deg i en komfortabel posisjon, gjerne på en bolster eller pute. Lukk øynene og ta noen dype åndedrag. Kjenn kontakten med underlaget og la kroppen lande i øyeblikket.
      Inviter en følelse av ro og tilstedeværelse. Sett en intensjon for praksisen din i dag – hva ønsker du å åpne opp for, eller gi slipp på?
      Vi puster inn gjennom nesa og puster ut gjennom nesa. La pusten være naturlig og uanstrengt, og la kroppen mykne med hver utpust. 
      Praksisen i dag fokuserer på å åpne opp hjerterommet og lungene, samtidig som vi støtter nyrene og urinblæren for en dypere følelse av ro og forankring.
      Vi tar et par pust og setter vår intesjon for timen før vi ohmer sammen tre ganger og starter praksisen. (en liten pause med tre pust for intensjon av praksisen).
      Pust inn før vi ohmer, og pust ut når vi ohmer, og gjenta dette tre ganger.
    Sensation:
      - Ro og tilstedeværelse
      - Pustkontakt
      - Intensjonsetting



  - Name: Dangling
    Duration: 4
    Description: |
      Stående oppreist med føttenei konfortabel avstand. Bøy knærne og fold forward. La armene og hodet henge tungt. 
      Hvil gjerne hendene på bolster eller blokker for støtte. La tyngden av hodet og armene trekke deg dypere inn i folden, og kjenn hvordan ryggraden frigjøres og åpner seg.
    Rebound:
      Duration: 0,5
      Description: Bøy i knær, slipp armene og rolig stå opp. Stå oppreist.
    Meridians:
      - Urinblære
      - Nyre
    Sensation:
      - Ryggradsfrigjøring
      - Forankring av nervesystemet
      - Åpning av bakside kroppen
    Transition: Fra stående til Squat. Vi står oppreist og forbereder oss på å gå ned i en dyp knebøy.



  - Name: Squat	
    Duration: 3
    Description: |
      Start i stående med føttene i hoftebreddes avstand, tærne peker litt ut. Bøy knærne og senk deg ned i en dyp knebøy- squat. La albuene presse knærne ut til siden for å åpne hoftene. 
      Hold ryggen lang og brystet åpent. Ha hendene i prayer position foran hjertet med albuene presse mot legg eller knær. La tyngden av kroppen synke ned i gulvet og kjenn en dyp åpning i hoftene.
      Skaper stabilitet og forankring – forberedelse til hjerteåpning.
    Adjustments: Hvis det er utfordrende å holde hælene nede, kan du plassere en sammenrullet matte eller et teppe under dem for støtte.
      **Rebound:** Stå oppreist i 0,5 min.
    Meridians:
      - Lever
      - Nyre
    Sensation:
      - Forankring
      - Bekkenstabilitet
      - Indre lår-åpning
    Transition: Fra stående til caterpillar. Vi setter oss ned og strekker beina ut foran oss.



  - Name: Caterpillar
    Duration: 4
    Description: |
      Beina strakt frem, lar overkroppen hvile avslappet forover, gjerne på et bolster.
      Slipper spenninger i rygg og hofter. Ingen aktiv strekking – la tyngden gjøre jobben.
    Rebound:
      Description: Ligge på ryggen (shavasana)
      Duration: 1
    
    Meridians:
      - Nyre
      - Urinblære
    Sensation:
      - Åpning av rygg og hofter
      - Avspanning i bakre kjede
      - Forankring
    Transition: Fra shavasana legger vi oss på siden og forbereder oss på liggende sommerfugl.Gjør klar en bolster på langs under ryggen, og eventulet bygg opp med blokker hvis du trenger å komme høyere opp.



  - Name: Liggende sommerfugl (Supta Baddha Konasana)
    Duration: 4
    Description: |
      Ligger på ryggen med et bolster under ryggen på langs, knærne ut til siden
      mens en har fotsålene samlet. La brystet åpne seg. Bygg gjerne opp med blokker under knærne for mer støtte og åpning. 

    Rebound:
      Description: Ligge på siden i fosterstilling før du setter deg opp i sittende posisjon.
      Duration: 0,5
    Meridians:
      - Hjerte
      - Lunge
    Sensation:
      - Bryst- og hjerteåpning
      - Pust som løfter hjertet
      - Avspanning i lysken
    Transition: Rull over på magen og ta ut bolstereen. Forbered deg på fiskeposisjonen.

  - Name: Fisk
    Duration: 4
    Description: |
      Åpner bryst og hals. Støtt gjerne med bolster under øvre rygg for en myk Yin-versjon.
      Håndflaten vender nedover og armene er strakt plassert under bekkenet. Len hodet bakover. 
      La brystet åpne seg og pusten bevege seg inn i hjerterommet.

    Rebound:
      Description: Ligge flatt på ryggen. Observer pusten og hvordan kroppen føles etter fiskeposisjonen.
      Duration: 0,5
    Meridians:
      - Hjerte
      - Lunge
    Sensation:
      - Ekspansjon i brystet
      - Åpning av halsen
      - Pusten dypner naturlig
    Transition: Fra shavasana legg deg på magen og forbered deg på sfinksposisjonen.



  - Name: Sfinks
    Duration: 4
    Description: |
      Ligg på magen. Plasser albuene litt foran skuldrene og hvil på underarmene.
      La magen smelte mot gulvet. Kjenn hvordan det føles i nedre korsrygg. hvis "sensasjonen" er for dyp, flytt albuene litt fremover for mindre kompresjon, eller trekk dem litt tilbake for mer kompresjon.
      Du kan gjerne bygge opp med en bolster under brystet for mer støtte og en mykere åpning.

      Legg merke til pusten som beveger seg inn i de øvre ribbeina og hjerterommet.
    Rebound:
      Description: Ligg flat på magen, snu hodet mot høyre og dra høyre kne oppover langs gulvet
      Duration: 1
    
    Meridians:
      - Urinblære
      - Nyre
      - Mage
      - Milt
    Sensation:
      - Kompresjon i korsryggen
      - Åpning av hjerterommet
      - Pustkontakt i øvre ribbein


  - Name: Sfinks – Sel-variant
    Duration: 4
    Description: |
      Rett armene mer ut for en dypere ryggbøy og kompresjon.
      Hold skuldrene avslappet ned fra ørene.
    Rebound:
      Description: Ligg flat på magen, snu hodet mot venstre og dra venstre kne oppover langs gulvet
      Duration: 1
    Meridians:
      - Urinblære
      - Nyre
      - Mage
      - Milt
    Sensation:
      - Dypere korsryggkompresjon
      - Åpning av mageregionen
      - Varmefølelse i kjernen
    Transition: Rull over på ryggen og forbered deg på støttet bro. Legg en bolster eller blokk under korsbenet for støtte.


  - Name: Støttet bro
    Duration: 4
    Description: 
      Start liggende på ryggen med bøyde knær.Løft hoftene nok til å legge en blokk under korsbenet for støttet bro.
      La kroppen synke ned i blokken og pust inn langs ryggen. Nå kan du holde armene ut til siden og gå fottene fra bekkenet for å strekke dem ut. 

    Rebound:
      Description: Ta ut blokken og klem knærne inn mot hverandre i 0,5 min.
      Duration: 0,5
    Meridians:
      - Nyre
      - Urinblære
    Sensation:
      - Åpning av hoftefleksorer
      - Støtte i sakrumregionen
      - Ro i nedre rygg
    Transition: Rull over på magen og forbered deg på svaneposisjonen.


  - Name: "Svane – Høyre side"
    Duration: 5
    Description: |
      Stå i hunden som ser ned. Strekk ut høyre bein og bring høyre kne frem mellom armene og len ut til høyre siden. 
      Ta en sjekk på hvordan det kjenens i kneet ditt. Hvis det kjennes bra i kneet, kan du flekse right fot og la hælen være i gulvet. 
      Hvis det kjennes ubehagelig i kneet, kan du holde foten flekset og la hælen løfte seg litt fra gulvet.
      Venstre bein strekkes bak med tærne i gulvet. La overkroppen lene seg fremover og la armene støtte deg.
      Hvis du vil ha en dypere åpning kan du prøve full svane ved å løfte deg opp på hendene og la kompresjonen i hoften øke. Hvis du ønsker en mer rolig og meditativ åpning, kan du prøve sovende svane ved å fold overkroppen forover over det fremre benet.

      **Full svane:** 3 minutter. Bli løftet på hender, kompresjon i høyre hofte.

      **Sovende svane:** 1 minutt. Fold overkroppen forover over det fremre benet.
    Rebound:
      Description: Barnets stilling
      Duration: 1
    
    Meridians:
      - Galleblære
      - Lever
    Sensation:
      - Dyp hofteåpning
      - Emosjonell frigjøring
      - Rotasjon i hofteleddet



  - Name: "Svane – Venstre side"
    Duration: 5
    Description: |
      Stå i hunden som ser ned. Strekk ut venstre bein og bring venstre kne frem mellom armene og len ut til venstre siden.
      Ta en sjekk på hvordan det kjenens i kneet ditt. Hvis det kjennes bra i kneet, kan du flekse venstre fot og la hælen være i gulvet. 
      Hvis det kjennes ubehagelig i kneet, kan du holde foten flekset og la hælen løfte seg litt fra gulvet.
      Høyre bein strekkes bak med tærne i gulvet. La overkroppen lene seg fremover og la armene støtte deg.
      Hvis du vil ha en dypere åpning kan du prøve full svane ved å løfte deg opp på hendene og la kompresjonen i hoften øke. Hvis du ønsker en mer rolig og meditativ åpning, kan du prøve sovende svane ved å fold overkroppen forover over det fremre benet.
      **Full svane:** 3 minutter. Bli løftet på hender, kompresjon i venstre hofte.

      **Sovende svane:** 1 minutt. Fold overkroppen forover over det fremre benet.

    Rebound:
      Description: Barnets stilling
      Duration: 1
    Meridians:
    - Galleblære
    - Lever
    Sensation:
      - Dyp hofteåpning
      - Emosjonell frigjøring
      - Rotasjon i hofteleddet
    Transition: Rull over og legg deg på ryggen for å forberede deg på Recline twist. Gjør klar en bolster på høyre side av kroppen for støtte under vridningen.  


  - Name: "Recline twist – Høyre side"
    Duration: 3
    Description: |
      Trekk knærne inn mot brystet og send venstre kne til høyre side av kroppen, gjerne støttet av bolster.
      Åpne dine armer ut som to vinger og la tyngden av knærne og overkroppen skape en mild vridning i ryggraden. 
      La hodet hvile mot gulvet eller vend det i motsatt retning av knærne for en dypere vridning.
      Begge skuldrene er hviler gulvet.

    Rebound:
      Description: Shavasana, observer pusten og hvordan kroppen føles etter vridningen.
      Duration: 0.5
    Meridians:
      - Galleblære
      - Urinblære
      - Hjerte
      - Lunge
    Sensation:
      - Avgiftning
      - Emosjonell opprulling via ryggradsrotasjon
      - Letthet i brystet



  - Name: "Recline twist – Venstre side"
    Duration: 3
    Description: |
      Trekk knærne inn mot brystet og send høyre kne til venstre side av kroppen, gjerne støttet av bolster.
      Åpne dine armer ut som to vinger og la tyngden av knærne og overkroppen skape en mild vridning i ryggraden. 
      La hodet hvile mot gulvet eller vend det i motsatt retning av knærne for en dypere vridning.
      Begge skuldrene er hviler gulvet.
    Rebound:
      Description: Shavasana, observer pusten og hvordan kroppen føles etter vridningen.
      Duration: 0.5
    Meridians:
      - Galleblære
      - Urinblære
      - Hjerte
      - Lunge
    Sensation:
      - Avgiftning
      - Emosjonell opprulling via ryggradsrotasjon
      - Letthet i brystet



  - Name: Shavasana
    Duration: 8
    Description: |
      Tid for å hvile. Shavasan er avslutnign av din praksis en naturlig del av reisen. La kroppen synke ned i underlaget og la pusten være naturlig og uanstrengt.
        La kroppen og sinnet smelte sammen. Legg merke til energien og det som har åpnet seg i løpet av praksisen. 
        Kjenn hvordan det føles å være i kroppen din akkurat nå, og la en følelse av takknemlighet for deg selv og din praksis vokse frem.
        En liten mantra om takknemlighet. 
         "Jeg er takknemlig for min kropp og min praksis. Jeg er åpen for det som har åpnet seg i meg i dag, og jeg bærer denne roen og åpenheten med meg videre."
         "Jeg er takknemlig for kjærligheten og støtten i mitt hjerterom. Jeg er åpen for å gi og motta kjærlighet i alle aspekter av livet mitt."
         "la mine tanker, ord og handlinger være fylt med kjærlighet og medfølelse. Jeg er takknemlig for muligheten til å åpne mitt hjerte og dele min kjærlighet med verden."
    Sensation:
      - Full hvile og integrasjon
      - Uanstrengt pust
      - Mykhet i hjerterommet
