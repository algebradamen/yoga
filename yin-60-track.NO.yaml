Name: "Yin Yoga – 60 minutter"
Duration: 60
Description: |
  **Tema:** Hjerte · Lunge · Nyre · Urinblære · Galleblære

  **Primære meridianer:** Hjerte, Lunge

  **Støtte:** Nyre, Urinblære, Galleblære, Lever

Poses:



  - Name: Landing
    Duration: 5
    Description: |
      Kom til ro i en komfortabel sittestilling eller konstruktiv hvile.
      Sett en intensjon for timen og bli oppmerksom på pusten.
      La kropp og sinn tune seg inn – uten å endre noe.
    Sensation:
      - Ro og tilstedeværelse
      - Pustkontakt
      - Intensjonsetting



  - Name: Hengende fremoverfold (Dangling)
    Duration: 4
    Description: |
      Stående fremoverfold – Yin-versjon. Forankrer nervesystemet
      før bryst og pust åpnes. La armene og hodet henge tungt.

      **Rebound:** Stå oppreist i 0,5 min.
    Meridians:
      - Urinblære
      - Nyre
    Sensation:
      - Ryggradsfrigjøring
      - Forankring av nervesystemet
      - Åpning av bakside kroppen



  - Name: Støttet huk (Malasana)
    Duration: 3
    Description: |
      Skaper stabilitet og forankring – forberedelse til hjerteåpning.

      **Rebound:** Stå oppreist i 0,5 min.
    Meridians:
      - Lever
      - Nyre
    Sensation:
      - Forankring
      - Bekkenstabilitet
      - Indre lår-åpning



  - Name: Caterpillar
    Duration: 4
    Rebound:
      Description: Ligge på ryggen (shavasana)
      Duration: 1
    Description: |
      Beina strakt frem, lar overkroppen hvile avslappet forover, gjerne på et bolster.
      Slipper spenninger i rygg og hofter. Ingen aktiv strekking – la tyngden gjøre jobben.
    Meridians:
      - Nyre
      - Urinblære
    Sensation:
      - Åpning av rygg og hofter
      - Avspanning i bakre kjede
      - Forankring



  - Name: Liggende sommerfugl (Supta Baddha Konasana)
    Duration: 4
    Description: |
      Ligger på ryggen med et bolster under ryggen på langs, knærne ut til siden
      mens en har fotsålene samlet. La brystet åpne seg.

      **Rebound:** Ligge på siden i 0,5 min.
    Meridians:
      - Hjerte
      - Lunge
    Sensation:
      - Bryst- og hjerteåpning
      - Pust som løfter hjertet
      - Avspanning i lysken



  - Name: Fisk
    Duration: 4
    Description: |
      Åpner bryst og hals. Støtt gjerne med bolster under øvre rygg for en myk Yin-versjon.
      Palmene vender oppover, armene åpner seg bredt.

      **Rebound:** Ligge flatt på ryggen i 0,5 min.
    Meridians:
      - Hjerte
      - Lunge
    Sensation:
      - Ekspansjon i brystet
      - Åpning av halsen
      - Pusten dypner naturlig



  - Name: Sfinks
    Duration: 4
    Rebound:
      Description: Ligg flat på magen, snu hodet mot høyre og dra høyre kne oppover langs gulvet
      Duration: 1
    Description: |
      Ligg på magen. Plasser albuene litt foran skuldrene og hvil på underarmene.
      La magen mykne mot gulvet.

      Legg merke til pusten som beveger seg inn i de øvre ribbeina og hjerterommet.
    Meridians:
      - Urinblære
      - Nyre
      - Mage
      - Milt
    Sensation:
      - Kompresjon i korsryggen
      - Åpning av hjerterommet
      - Pustkontakt i øvre ribbein



  - Name: Sfinks – Sel-variant
    Duration: 4
    Rebound:
      Description: Ligg flat på magen, snu hodet mot venstre og dra venstre kne oppover langs gulvet
      Duration: 1
    Description: |
      Rett armene mer ut for en dypere ryggbøy og kompresjon.
      Hold skuldrene avslappet ned fra ørene.
    Meridians:
      - Urinblære
      - Nyre
      - Mage
      - Milt
    Sensation:
      - Dypere korsryggkompresjon
      - Åpning av mageregionen
      - Varmefølelse i kjernen



  - Name: Støttet bro
    Duration: 4
    Description: |
      Legg en blokk under korsbenet for støttet bro.
      La kroppen synke ned i blokken og pust inn langs ryggen.

      **Rebound:** Ta ut blokken og klem knærne inn mot hverandre i 0,5 min.
    Meridians:
      - Nyre
      - Urinblære
    Sensation:
      - Åpning av hoftefleksorer
      - Støtte i sakrumregionen
      - Ro i nedre rygg



  - Name: "Svane – Høyre side"
    Duration: 5
    Rebound:
      Description: Barnets positur
      Duration: 1
    Description: |
      Bring høyre kne frem og ut til siden, venstre bein strekkes bak.

      **Full svane:** 3 minutter. Bli løftet på hender, kompresjon i høyre hofte.

      **Sovende svane:** 1 minutt. Fold overkroppen forover over det fremre benet.
    Meridians:
      - Galleblære
      - Lever
    Sensation:
      - Dyp hofteåpning
      - Emosjonell frigjøring
      - Rotasjon i hofteleddet



  - Name: "Svane – Venstre side"
    Duration: 5
    Rebound:
      Description: Barnets positur
      Duration: 1
    Description: |
      Gjenta på venstre side.

      **Full svane:** 3 minutter.

      **Sovende svane:** 1 minutt.
    Meridians:
      - Galleblære
      - Lever
    Sensation:
      - Dyp hofteåpning
      - Emosjonell frigjøring
      - Rotasjon i hofteleddet



  - Name: "Liggende vridning – Høyre side"
    Duration: 3
    Description: |
      Trekk knærne inn og send høyre kne til venstre, gjerne støttet av bolster.
      Skuldrene tunge mot gulvet.

      **Rebound:** Shavasana 0,5 min.
    Meridians:
      - Galleblære
      - Urinblære
      - Hjerte
      - Lunge
    Sensation:
      - Avgiftning
      - Emosjonell opprulling via ryggradsrotasjon
      - Letthet i brystet



  - Name: "Liggende vridning – Venstre side"
    Duration: 3
    Description: |
      Gjenta på motsatt side.

      **Rebound:** Shavasana 0,5 min.
    Meridians:
      - Galleblære
      - Urinblære
      - Hjerte
      - Lunge
    Sensation:
      - Avgiftning
      - Emosjonell opprulling via ryggradsrotasjon
      - Letthet i brystet



  - Name: Shavasana
    Duration: 8
    Description: |
      Total hvile. Inviter mykhet bak hjertet og en lett, uanstrengt pust.
      La effektene av øvelsen integreres fullt ut.
    Sensation:
      - Full hvile og integrasjon
      - Uanstrengt pust
      - Mykhet i hjerterommet
