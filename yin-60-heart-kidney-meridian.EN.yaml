Name: "Yin Yoga – Heart and Kidney Meridians"
Duration: 60
Description: |
  **Theme:** Anchoring the heart · Opening the breath · Emotional balance

  **Primary meridians:** Heart, Lung

  **Secondary support:** Kidney, Urinary Bladder

Poses:



  - Name: Opening Meditation
    Duration: 3
    Description: |
      Arrival in stillness. Feel the weight of the body supported by the ground.
      Invite awareness to the natural rhythm of the breath – without changing it.
      Set an intention connected to the heart: openness, compassion, or presence.
    Sensation:
      - Groundedness
      - Heart awareness
      - Softened breath



  - Name: Hanging Forward Fold
    Duration: 3
    Description: |
      Standing forward fold – Yin version. Ground the nervous system before opening the chest and breath.
    Rebound:
      Description: Constructive rest or standing pause
      Duration: 1
    Meridians:
      - Urinary Bladder
      - Kidney
    Sensation:
      - Spinal release
      - Nervous system grounding
      - Opening of the back body
    Alternatives:
        - Name: Standing Forward Fold with Support
          Description: |
            Place the hands on blocks or a bolster to reduce intensity and encourage deeper relaxation.



  - Name: Supported Squat (Malasana)
    Duration: 3
    Description: |
      Creates stability and grounding – as preparation for heart opening later.
    Rebound:
      Description: Seated stillness
      Duration: 1
    Meridians:
      - Kidney
      - Liver
      - Spleen
    Sensation:
      - Grounding
      - Pelvic stability
      - Inner thigh release



  - Name: "Dragonfly – Right Side"
    Duration: 3
    Description: |
      From a wide seated straddle, fold over the right leg. Keep the spine relaxed – no pulling.
      Let the breath widen the spinal ribs.

      **Counterpose:** Windshield Wiper – 1 minute.
    Meridians:
      - Liver
      - Kidney
      - Urinary Bladder
    Sensation:
      - Inner thighs, hamstrings
      - Breath widening the spinal ribs



  - Name: "Dragonfly – Left Side"
    Duration: 3
    Description: |
      Fold over the left leg. Keep the spine relaxed – no pulling.
      Let the breath widen the spinal ribs.

      **Counterpose:** Windshield Wiper – 1 minute.
    Meridians:
      - Liver
      - Kidney
      - Urinary Bladder
    Sensation:
      - Inner thighs, hamstrings
      - Breath widening the spinal ribs



  - Name: "Dragonfly – Center"
    Duration: 3
    Description: |
      Fold forward down the center. Keep the spine relaxed – no pulling.
      Let the breath widen the spinal ribs.

      **Counterpose:** Windshield Wiper – 1 minute.
    Meridians:
      - Liver
      - Kidney
      - Urinary Bladder
    Sensation:
      - Inner thighs, hamstrings
      - Breath widening the spinal ribs



  - Name: Sphinx
    Duration: 3
    Description: |
      Lie on your belly. Place the elbows slightly in front of the shoulders and rest on the forearms. Let
      the belly soften toward the floor.

      Notice the breath moving into the upper ribs and the heart space.

      **Counterpose:** Rest on the belly, head turned to the right, right knee drawn up – 1 minute.
    Meridians:
      - Urinary Bladder
      - Kidney
      - Lung
      - Heart
    Sensation:
      - Compression in the lower back
      - Opening of the heart space
      - Breath deepening into the upper ribs



  - Name: Supported Fish
    Duration: 4
    Description: |
      Lie back over a bolster placed horizontally under the upper back and heart.
      Head and neck supported. Legs extended or bent, arms opening wide with palms facing up.

      **Yin reminder:** Support is essential – this pose should feel *held*, not strained.
    Rebound:
      Description: Shavasana or constructive rest
      Duration: 1
    Meridians:
      - Heart
      - Lung
    Sensation:
      - Expansion across the chest, collarbones, shoulders
      - Breath deepens naturally
      - Emotional openness or vulnerability may arise




  - Name: "Swan – Right Side"
    Duration: 4
    Description: |
      Bring the right knee forward and out to the side, left leg extends behind.

      **Full Swan:** 1 minute. Rise up onto the hands, compression in the right hip.

      **Sleeping Swan:** 3 minutes. Fold the upper body forward over the front leg.

      **Counterpose:** Child's Pose – 1 minute.
    Meridians:
      - Liver
      - Gallbladder
    Sensation:
      - Deep hip opening
      - Emotional release before heart work



  - Name: "Swan – Left Side"
    Duration: 4
    Description: |
      Repeat on the left side.

      **Full Swan:** 1 minute.

      **Sleeping Swan:** 3 minutes.
    Rebound:
      Description: Shavasana
      Duration: 1
    Meridians:
      - Liver
      - Gallbladder
    Sensation:
      - Deep hip opening
      - Emotional release before heart work



  - Name: Melting Heart (Anahatasana)
    Duration: 4
    Description: |
      From tabletop position, keep the hips over the knees and melt the chest slowly toward the floor.
      Forehead or chin rests on support. Arms extended or bent.
    Rebound:
      Description: Child's Pose
      Duration: 1
    Meridians:
      - Lung
      - Heart
    Sensation:
      - Chest, shoulders, armpits
      - Breath awareness – especially the inhale



  - Name: Reclined Butterfly (Supta Baddha Konasana)
    Duration: 5
    Description: |
      Lie back over a bolster placed lengthwise. Soles of the feet together, knees supported.
      Arms can open wide or rest on the belly and heart.

      Feel the breath gently lifting the heart.
    Rebound:
      Description: Shavasana
      Duration: 1
    Meridians:
      - Heart
      - Lung
    Sensation:
      - Deep chest and heart opening
      - Breath lifting the heart
      - Complete surrender



  - Name: "Reclined Twist – Right Side"
    Duration: 3
    Description: |
      Draw the knees in, send the right knee to the left, supported by a bolster.
      Left leg relaxed and long. Shoulders heavy.
    Rebound:
      Description: Shavasana
      Duration: 1
    Meridians:
      - Gallbladder
      - Urinary Bladder
      - Heart
    Sensation:
      - Detoxification
      - Emotional unraveling through gentle spinal rotation



  - Name: "Reclined Twist – Left Side"
    Duration: 3
    Description: |
      Repeat on the opposite side.
    Rebound:
      Description: Shavasana
      Duration: 1
    Meridians:
      - Gallbladder
      - Urinary Bladder
      - Heart
    Sensation:
      - Detoxification
      - Emotional unraveling through gentle spinal rotation



  - Name: Closing Shavasana
    Duration: 9
    Description: |
      Complete rest. Invite softness behind the heart and a light, effortless breath.
      Allow the effects of the practice to integrate fully.
    Sensation:
      - Softness behind the heart
      - Effortless breath
      - Complete integration
